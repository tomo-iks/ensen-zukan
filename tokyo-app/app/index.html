<title>沿線まち図鑑</title>
<style>
#boot{position:fixed;inset:0;z-index:2000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:#F4F2EC;color:#1F2629;font-family:"BIZ UDPGothic","Hiragino Sans","Yu Gothic",sans-serif;transition:opacity .45s ease}
@media (prefers-color-scheme: dark){#boot{background:#121619;color:#E6ECEE}}
#boot.done{opacity:0;pointer-events:none}
#boot{overflow:hidden;display:block;animation:bootout .45s linear 6.15s forwards}
#boot .jp{display:none}@keyframes jphide{99%{opacity:0}to{opacity:0;visibility:hidden}}   /* 後半は、日本地図を描かない(描画を軽くし、ちらつきを防ぐ) */

#boot .bsv{position:absolute;left:0;top:0;width:100%;height:100%;overflow:visible}
#boot .bcv{position:absolute;left:0;top:0;width:100%;height:100%}
#boot.cv .bsv{display:none}
#boot .bwrap{position:absolute;left:0;top:0;width:100%;height:100%;transform-origin:var(--ox,0px) var(--oy,0px);will-change:transform;backface-visibility:hidden}
/* カメラ: 日本地図(北が上)→ 90度右回転しながら拡大して東京が縦向き(3秒)→ 左回りに90度回転しながら新宿へ拡大(3秒) */
#boot .cam{transform-origin:var(--ox,0px) var(--oy,0px);transform:translate(var(--tAx,0px),var(--tAy,0px)) rotate(90deg) scale(var(--sA,1));animation:bcam 6s linear forwards}
@keyframes bcam{
  0%{transform:translate(var(--t0x,0px),var(--t0y,0px)) rotate(0deg) scale(var(--s0,.03));animation-timing-function:cubic-bezier(.5,.05,.25,1)}
  50%{transform:translate(var(--tAx,0px),var(--tAy,0px)) rotate(90deg) scale(var(--sA,1));animation-timing-function:cubic-bezier(.45,0,.2,1)}
  100%{transform:translate(var(--tBx,0px),var(--tBy,0px)) rotate(0deg) scale(var(--sB,1))}}
#boot .jp path{fill:#DCE7E2;stroke:#DCE7E2;stroke-width:30;stroke-linejoin:round}   /* 県と県のすき間(簡略化で生じる細い黒い欠け)を、同じ色の縁取りで埋める */#boot .bw{fill:var(--muni-on,#DCE7E2);stroke:var(--muni-edge,#8FA29A);stroke-width:.5px;stroke-linejoin:round}#boot:not(.go),#boot:not(.go) *{animation-play-state:paused!important}
#boot .bw{opacity:0;animation:bwin .5s ease-out forwards}
@keyframes bwin{to{opacity:1}}
#boot .br{fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;animation:br .9s ease-in-out forwards}
#boot .br.jy{stroke:#5FA834;animation-delay:1.9s}
#boot .br.jc{stroke:#E2592A;animation-delay:2.1s}
@keyframes bhide{to{visibility:hidden}}
@keyframes bfade{to{opacity:0;visibility:hidden}}
#boot .bw.nf{animation:bwin .5s ease-out forwards,bfade 1.2s linear 3s forwards}
@keyframes bshow{from{visibility:hidden}to{visibility:visible}}
/* 後半(拡大)は、太さが画面上で一定の線・点に差し替える(拡大しても、太くならない) */
#boot .br2,#boot .bd2{display:none}
#boot .br2{fill:none;stroke-width:5px;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
#boot .br2.jy{stroke:#5FA834}#boot .br2.jc{stroke:#E2592A}
#boot .bd2 path{fill:none;stroke-linecap:round;vector-effect:non-scaling-stroke}
#boot .bd2 .o{stroke:#1F2629;stroke-width:13px}#boot .bd2 .i{stroke:#fff;stroke-width:9px}
#boot .bd{animation:bwin .3s ease-out forwards,bhide .01s linear 3s forwards}
@keyframes br{to{stroke-dashoffset:0}}
#boot .bd{fill:#fff;stroke:#1F2629;stroke-width:.8;r:2.2px;opacity:0;animation:bwin .3s ease-out forwards}
#boot h1,#boot p{position:absolute;left:0;right:0;text-align:center;animation:bfade .5s ease 3s forwards}
@keyframes bfade{to{opacity:0}}
#boot h1{bottom:11vh;margin:0}
#boot p{bottom:7vh}
#boot.done{opacity:0!important;pointer-events:none;transition:opacity .35s}
@media (prefers-color-scheme: dark){#boot .bd2 .o{stroke:#121619}#boot .bd2 .i{stroke:#E6ECEE}#boot .jp path{fill:#22343A;stroke:#22343A}#boot .bd{fill:#E6ECEE;stroke:#121619}}
@media (prefers-reduced-motion: reduce){#boot{animation-delay:.6s}#boot .cam{animation:none;transform:translate(var(--tBx,0px),var(--tBy,0px)) rotate(0deg) scale(var(--sB,1))}#boot .bw,#boot .bd{animation:none;opacity:1}#boot .br{animation:none;stroke-dashoffset:0}#boot h1,#boot p{animation:none;opacity:0}}
#boot .bm{display:none}
#boot .bm i{display:block;width:12px;border-radius:4px;animation:bootbar 1.2s ease-in-out infinite}
#boot .bm i:nth-child(1){height:46px;background:#5FA834}
#boot .bm i:nth-child(2){height:34px;background:#E2592A;animation-delay:.18s}
#boot .bm i:nth-child(3){height:24px;background:#2860A8;animation-delay:.36s}
@keyframes bootbar{0%,100%{transform:scaleY(.55);opacity:.6}50%{transform:scaleY(1);opacity:1}}
#boot h1{margin:0;font-size:22px;font-weight:700;letter-spacing:.06em}
#boot p{margin:0;font-size:13px;opacity:.7;letter-spacing:.04em}
#boot .tr{width:180px;height:3px;border-radius:2px;background:rgba(127,127,127,.25);overflow:hidden}
#boot .tr b{display:block;width:40%;height:100%;border-radius:2px;background:#2860A8;animation:bootslide 1.3s ease-in-out infinite}
@keyframes bootslide{0%{margin-left:-40%}100%{margin-left:100%}}
@media (prefers-reduced-motion: reduce){#boot .bm i,#boot .tr b{animation:none}}
</style>

<style>
/* Layout: 地図が全面。上に検索バー、下（PCでは左）に図鑑・クイズ・記録のパネル */
:root{
  --sea:#D5DCDD; --land:#F4F6F2; --land23:#FAFBF8; --border:#A3AFB2;
  --panel:#FCFDFC; --ink:#1B2225; --ink2:#5A666B; --rule:#D6DDDF; --chip:#EDF1F1;
  --jy:#5FA834; --jc:#E2592A; --accent:#1E5B6E; --want:#D9971A; --ok:#2E8A57; --ng:#C2412D;
  --shadow:0 6px 24px rgba(20,35,40,.16);
  --muni-on:#DDE9E6; --muni-edge:#7F9599; --muni-sel:#BFDCE3;
  --park:#CFE3C6; --water:#B9D6E3; --road:#FFFFFF; --road1:#F3DE9E; --bldg:#DADFE1; --bldgline:#BCC4C8;
  --k-food:#C9483B; --k-view:#2C7DA0; --k-hist:#7656A8; --k-shop:#BF3A7A; --k-other:#5F6B70;
  --rc-food:#B4532A; --rc-cafe:#8A5B2E; --rc-spot:#B0304F; --rc-play:#2D7A68;
  --f-disp:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;
  --f-body:"BIZ UDPGothic","Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
  --f-num:"Barlow Condensed","Arial Narrow",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --sea:#0E1315; --land:#1A2326; --land23:#1F292C; --border:#3E4C51;
  --panel:#151C1F; --ink:#E3EAEC; --ink2:#97A5AA; --rule:#2B363A; --chip:#212B2E;
  --jy:#78C04B; --jc:#EE7244; --accent:#72B6C9; --want:#E7B23E; --ok:#5DBB84; --ng:#E26D59;

  --muni-on:#1F3236; --muni-edge:#557077; --muni-sel:#24505C;
  --park:#22362A; --water:#1C3644; --road:#3A4A51; --road1:#6A5E36; --bldg:#283236; --bldgline:#1A2225;
  --k-food:#E0675A; --k-view:#4FA3C7; --k-hist:#9C80CC; --k-shop:#DE6A9F; --k-other:#8A979C;
  --rc-food:#E58A5E; --rc-cafe:#C79A6B; --rc-spot:#E2678A; --rc-play:#5EC2A8;
  --shadow:0 6px 24px rgba(0,0,0,.45); color-scheme:dark}}
:root[data-theme="dark"]{
  --sea:#0E1315; --land:#1A2326; --land23:#1F292C; --border:#3E4C51;
  --panel:#151C1F; --ink:#E3EAEC; --ink2:#97A5AA; --rule:#2B363A; --chip:#212B2E;
  --jy:#78C04B; --jc:#EE7244; --accent:#72B6C9; --want:#E7B23E; --ok:#5DBB84; --ng:#E26D59;

  --muni-on:#1F3236; --muni-edge:#557077; --muni-sel:#24505C;
  --park:#22362A; --water:#1C3644; --road:#3A4A51; --road1:#6A5E36; --bldg:#283236; --bldgline:#1A2225;
  --k-food:#E0675A; --k-view:#4FA3C7; --k-hist:#9C80CC; --k-shop:#DE6A9F; --k-other:#8A979C;
  --rc-food:#E58A5E; --rc-cafe:#C79A6B; --rc-spot:#E2678A; --rc-play:#5EC2A8;
  --shadow:0 6px 24px rgba(0,0,0,.45); color-scheme:dark}
html,body{height:100%;overscroll-behavior:none}   /* ブラウザの引っぱり更新・ゴム伸びで画面が揺れないように */
body{background:var(--sea);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.7;overflow:hidden}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#map{position:fixed;inset:0;background:var(--sea);z-index:0}
.leaflet-container{background:var(--sea);font-family:var(--f-body)}
.leaflet-control-attribution{background:color-mix(in srgb,var(--panel) 80%,transparent)!important;color:var(--ink2)!important;font-size:10px}
.leaflet-control-attribution a{color:var(--accent)}
.leaflet-bar a{background:var(--panel);color:var(--ink);border-color:var(--rule)}
.leaflet-bar a:hover{background:var(--chip)}
.leaflet-top.leaflet-right{top:calc(env(safe-area-inset-top,0px) + 96px)}
@media (min-width:860px){.leaflet-top.leaflet-right{top:calc(env(safe-area-inset-top,0px) + 56px)}}
.leaflet-tooltip.st-label{background:none;border:0;box-shadow:none;padding:0 2px;font-family:var(--f-disp);font-weight:700;font-size:15px;color:var(--ink);text-shadow:0 0 3px var(--land),0 0 3px var(--land),0 0 2px var(--land)}
.leaflet-tooltip.st-label::before{display:none}
.leaflet-tooltip.muni-label{background:none;border:0;box-shadow:none;padding:0;color:var(--ink2);font-size:12px;letter-spacing:.12em;opacity:.75}
.leaflet-tooltip.muni-label::before{display:none}
.leaflet-tooltip.st-label.sel{font-size:17px;color:var(--accent)}
.hide-st .st-label{display:none}
.far .st-label.t2,.far .st-label.t3,.mid .st-label.t3{display:none}.far .st-label.sel,.mid .st-label.sel{display:block}
.leaflet-tooltip.st-label.leaflet-tooltip-top,.leaflet-tooltip.st-label.leaflet-tooltip-bottom{padding:8px 10px;margin-left:0}
.leaflet-tooltip.st-label.leaflet-tooltip-left{padding:10px 6px 10px 12px;margin-left:-2px}
/* v24: 小さな印も、見えない余白をつけて押しやすくする */
.recm{position:relative;margin:10px;transform:scale(var(--zs,1))}.recm::after{content:"";position:absolute;inset:-10px;border-radius:50%}
.pinm{transform:rotate(-45deg) scale(var(--zs,1))!important}
.pinm::before{content:"";position:absolute;inset:-8px;border-radius:50%;transform:rotate(45deg)}
.muni-off .muni-label{display:none}

/* 上部バー */
#top{position:fixed;z-index:500;top:calc(env(safe-area-inset-top,0px) + 10px);left:12px;right:12px;display:flex;flex-direction:column;gap:8px;pointer-events:none}
#top > *{pointer-events:auto}
.row1{display:flex;gap:8px;align-items:center}
.brand{font-family:var(--f-disp);font-weight:900;font-size:14px;letter-spacing:.04em;background:var(--panel);padding:8px 12px;border-radius:var(--r);box-shadow:var(--shadow);white-space:nowrap;display:flex;gap:6px;align-items:center}
.brand i{display:inline-block;width:8px;height:16px;border-radius:2px;background:var(--jy)}
.brand i+i{background:var(--jc);margin-left:-4px}
.search{flex:1;min-width:0;position:relative}
.search input{width:100%;box-sizing:border-box;border:1px solid var(--rule);background:var(--panel);border-radius:var(--r);padding:8px 12px;box-shadow:var(--shadow)}
#results{position:absolute;top:calc(100% + 4px);left:0;right:0;background:var(--panel);border-radius:var(--r);box-shadow:var(--shadow);max-height:50vh;overflow:auto;padding:4px}
#results button{display:flex;width:100%;gap:8px;align-items:baseline;border:0;background:none;text-align:left;padding:8px 10px;border-radius:var(--r)}
#results button:hover{background:var(--chip)}
#results small{color:var(--ink2)}
.row2{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.seg{display:flex;background:var(--panel);border-radius:var(--r);box-shadow:var(--shadow);padding:3px}
.seg button{border:0;background:none;padding:5px 12px;border-radius:var(--r);font-weight:700;font-size:13px;color:var(--ink2);display:flex;gap:6px;align-items:center}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block}
.pill-btn{border:0;background:var(--panel);box-shadow:var(--shadow);border-radius:var(--r);padding:8px 12px;font-size:12px;font-weight:700;color:var(--ink2)}
.pill-btn[aria-pressed="true"]{color:var(--accent)}

/* パネル */
#panel{position:fixed;z-index:600;left:0;right:0;bottom:0;background:var(--panel);border-radius:var(--r-l) 18px 0 0;box-shadow:var(--shadow);display:flex;flex-direction:column;max-height:56%;padding-bottom:env(safe-area-inset-bottom,0px)}
.phead{display:flex;flex-direction:column;align-items:stretch;padding:6px 16px 0;border-bottom:1px solid var(--rule)}
.handle{align-self:center;width:44px;height:5px;border-radius:3px;background:var(--rule);border:0;padding:0;margin:2px 0 6px}
.tabs{display:flex;gap:4px}
.tabs button{flex:1;border:0;background:none;padding:8px 0 10px;font-weight:700;color:var(--ink2);border-bottom:3px solid transparent;font-size:14px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.pbody{overflow:auto;padding:14px 16px 18px;-webkit-overflow-scrolling:touch}
#panel.collapsed .pbody{display:none}
@media (min-width:860px){
  #panel{left:16px;right:auto;width:390px;top:calc(env(safe-area-inset-top,0px) + 16px);bottom:16px;max-height:none;border-radius:var(--r-l)}
  .handle{display:none}
  #top{left:422px}
}

h2.st-name{font-family:var(--f-disp);font-weight:900;font-size:30px;line-height:1.15;margin:4px 0 0;letter-spacing:.02em;text-wrap:balance}
.kana{color:var(--ink2);font-size:12px;letter-spacing:.1em}
.badges{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.nb{font-family:var(--f-num);font-weight:700;font-size:14px;line-height:1;display:inline-flex;flex-direction:column;align-items:center;justify-content:center;width:34px;height:34px;border:3px solid var(--jy);border-radius:6px;background:var(--panel);font-variant-numeric:tabular-nums}
.nb.jc{border-color:var(--jc)}
.nb b{font-size:11px;font-weight:600;letter-spacing:.04em}
.meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:3px 9px;border-radius:999px;background:var(--chip);color:var(--ink2);border:0}
button.chip[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
.sec{margin-top:16px}
.sec h3{font-size:11px;letter-spacing:.14em;color:var(--ink2);margin:0 0 4px;font-weight:700;display:flex;gap:8px;align-items:center}
.sec p{margin:0}
.flag{font-size:11px;letter-spacing:.04em;color:var(--want);border:1px solid currentColor;border-radius:4px;padding:0 5px;font-weight:700}
.spots{margin:0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:6px}
.spots li{font-size:13px;padding:4px 10px;border:1px solid var(--rule);border-radius:var(--r)}
.note{margin-top:12px;font-size:12px;color:var(--ink2);padding:8px 10px;background:var(--chip);border-radius:var(--r)}
.rec{margin-top:18px;padding-top:14px;border-top:1px dashed var(--rule);display:flex;flex-direction:column;gap:10px}
.rec .btns{display:flex;gap:8px}
.tog{flex:1;border:1.5px solid var(--rule);background:none;border-radius:var(--r);padding:8px;font-weight:700;color:var(--ink2)}
.tog.v[aria-pressed="true"]{border-color:var(--ok);color:var(--ok);background:color-mix(in srgb,var(--ok) 10%,transparent)}
.tog.w[aria-pressed="true"]{border-color:var(--want);color:var(--want);background:color-mix(in srgb,var(--want) 10%,transparent)}
.rec label{font-size:11px;letter-spacing:.12em;color:var(--ink2);font-weight:700}
.rec input[type=date],.rec textarea{width:100%;box-sizing:border-box;border:1px solid var(--rule);background:var(--panel);border-radius:var(--r);padding:8px}
.rec textarea{min-height:64px;resize:vertical}
.nav{display:flex;flex-direction:column;gap:6px;margin-top:16px}
.navrow{display:flex;align-items:center;gap:6px;font-size:13px}
.navrow .ln{width:10px;height:10px;border-radius:2px;flex:none}
.navrow button{flex:1;border:1px solid var(--rule);background:none;border-radius:var(--r);padding:6px 8px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.navrow button:first-of-type{text-align:left}.navrow button:last-of-type{text-align:right}
.back{border:0;background:none;color:var(--accent);font-weight:700;padding:0;font-size:13px}
.qs{font-size:12px;color:var(--ink2)}

.lead{margin:0 0 12px;color:var(--ink2)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.group h3{font-size:11px;letter-spacing:.14em;color:var(--ink2);margin:14px 0 6px;display:flex;gap:6px;align-items:center}
.stlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:6px}
.stlist button{border:1px solid var(--rule);background:none;border-radius:var(--r);padding:6px 8px;text-align:left;display:flex;gap:6px;align-items:center;font-size:13px;min-width:0}
.stlist button span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stlist button.dim{opacity:.35}
.st-dot{width:8px;height:8px;border-radius:50%;border:1.5px solid var(--ink);flex:none;box-sizing:border-box}
.st-dot.v{background:var(--ok);border-color:var(--ok)}
.st-dot.w{border-color:var(--want);background:var(--want)}
.disclaim{margin-top:16px;font-size:11px;color:var(--ink2)}

/* クイズ */
.modes{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mode{border:1.5px solid var(--rule);background:none;border-radius:var(--r-l);padding:12px;text-align:left;display:flex;flex-direction:column;gap:2px}
.mode b{font-family:var(--f-disp);font-size:16px}
.mode small{color:var(--ink2);font-size:12px;line-height:1.5}
.mode .best{font-family:var(--f-num);font-size:13px;color:var(--accent);margin-top:4px;font-variant-numeric:tabular-nums}
.qhead{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--ink2)}
.qnum{font-family:var(--f-num);font-size:16px;font-variant-numeric:tabular-nums;color:var(--ink)}
.prompt{font-family:var(--f-disp);font-weight:900;font-size:24px;margin:8px 0;line-height:1.3}
.qtext{background:var(--chip);border-radius:var(--r);padding:10px 12px;margin:8px 0}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.opt{border:1.5px solid var(--rule);background:none;border-radius:var(--r);padding:10px;font-weight:700}
.opt.right{border-color:var(--ok);color:var(--ok);background:color-mix(in srgb,var(--ok) 10%,transparent)}
.opt.wrong{border-color:var(--ng);color:var(--ng)}
.fb{margin-top:10px;padding:10px 12px;border-radius:var(--r);background:var(--chip)}
.fb b{font-family:var(--f-num);font-size:20px;font-variant-numeric:tabular-nums}
.primary{border:0;background:var(--ink);color:var(--panel);border-radius:var(--r);padding:10px 16px;font-weight:700;width:100%;margin-top:10px}
.ghost{border:1.5px solid var(--rule);background:none;border-radius:var(--r);padding:9px 16px;font-weight:700;width:100%;margin-top:8px;color:var(--ink2)}
.big{font-family:var(--f-num);font-weight:700;font-size:56px;line-height:1;font-variant-numeric:tabular-nums}
.big small{font-size:20px;color:var(--ink2)}
.reslist{margin:12px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px}
.reslist li{display:flex;justify-content:space-between;gap:8px;font-size:13px;border-bottom:1px solid var(--rule);padding:4px 0}
.reslist li span:last-child{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-size:14px}

/* 記録 */
.prog{display:flex;flex-direction:column;gap:10px;margin-bottom:14px}
.pr{display:grid;grid-template-columns:72px 1fr auto;gap:10px;align-items:center;font-size:13px}
.bar{height:10px;border-radius:5px;background:var(--chip);overflow:hidden;position:relative}

.k-food{--kc:var(--k-food)}.k-view{--kc:var(--k-view)}.k-hist{--kc:var(--k-hist)}.k-shop{--kc:var(--k-shop)}.k-other{--kc:var(--k-other)}

.kdot{width:9px;height:9px;border-radius:50%;background:var(--kc);display:inline-block;flex:none}

.pinlist{display:flex;flex-direction:column;gap:8px;margin-top:4px}

.pr-t{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.pickmsg{margin-top:12px;padding:12px;border-radius:var(--r);background:var(--chip)}
#map.picking,#map.picking .leaflet-interactive{cursor:crosshair}
.pform{display:flex;flex-direction:column;gap:12px;margin-top:8px}

.pform input:not([type=file]),.pform textarea{width:100%;box-sizing:border-box;border:1px solid var(--rule);background:var(--panel);border-radius:var(--r);padding:8px}

.err{color:var(--ng);font-size:12px;margin-top:4px}
.thumbs{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.th{position:relative;width:64px;height:64px}
.th img{width:100%;height:100%;object-fit:cover;border-radius:var(--r);display:block}
.th button{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;border:0;background:var(--ink);color:var(--panel);font-size:13px;line-height:22px;padding:0}
.pform .addph{width:64px;height:64px;border:1.5px dashed var(--rule);border-radius:var(--r);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:20px;color:var(--ink2);cursor:pointer;letter-spacing:0;font-weight:400;box-sizing:border-box}
.addph span{font-size:11px}
.pin-title{font-family:var(--f-disp);font-weight:900;font-size:24px;margin:8px 0 10px;line-height:1.3;text-wrap:balance;overflow-wrap:anywhere}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:6px}
.gph{border:0;padding:0;background:var(--chip);border-radius:var(--r);overflow:hidden;aspect-ratio:1;max-width:100%}
.gph img{width:100%;height:100%;object-fit:cover;display:block}
.pin-comment{white-space:pre-wrap;margin:12px 0 0;overflow-wrap:anywhere}
.btns2{display:flex;gap:8px;margin-top:8px}.btns2>*{flex:1;margin-top:0}
.danger{color:var(--ng)!important}
.dangerbg{background:var(--ng)!important}
.confirm{margin-top:10px;padding:12px;border-radius:var(--r);border:1.5px solid var(--ng);font-size:13px}
.filebtn{display:block;text-align:center;box-sizing:border-box;cursor:pointer}
#viewer{position:fixed;inset:0;z-index:1000;background:rgba(8,12,14,.94);display:flex;align-items:center;justify-content:center}
#vw-img{max-width:calc(100% - 32px);max-height:calc(100% - 140px);object-fit:contain;border-radius:6px}
#viewer button{position:absolute;width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.16);color:#fff;font-size:24px;line-height:1}
#vw-close{top:calc(env(safe-area-inset-top,0px) + 12px);right:12px}
#vw-prev,#vw-next{top:50%;transform:translateY(-50%)}#vw-prev{left:8px}#vw-next{right:8px}
#vw-cap{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);left:16px;right:16px;text-align:center;color:#E6ECEE;font-size:13px}
.rc-food{--rc:var(--rc-food)}.rc-cafe{--rc:var(--rc-cafe)}.rc-spot{--rc:var(--rc-spot)}.rc-play{--rc:var(--rc-play)}
.recm{width:26px;height:26px;border-radius:7px;background:var(--panel);border:2.5px solid var(--rc);display:grid;place-items:center;box-sizing:border-box;box-shadow:0 1px 4px rgba(0,0,0,.25)}
.recm span{color:var(--rc);font-weight:900;font-size:13px;font-family:var(--f-disp);line-height:1}
.recthumb{background:var(--panel)!important;color:var(--rc)!important;border:2.5px solid var(--rc);box-sizing:border-box}
.seg2{box-shadow:none;background:var(--chip);margin-top:12px}.seg2 button{flex:1;justify-content:center}.seg2 small{font-family:var(--f-num);font-size:13px;opacity:.8}
.links{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:4px}.links a{color:var(--accent);overflow-wrap:anywhere}
@media (max-width:420px){.lnw{display:none}.seg button{padding:5px 8px;white-space:nowrap}.pill-btn{padding:8px 9px;white-space:nowrap}.row2{gap:6px;flex-wrap:nowrap}}
.seg2 button{padding:6px 2px;font-size:12px;white-space:nowrap}
.ffilter{display:flex;flex-direction:column;gap:8px;margin:12px 0 4px;padding:10px;border-radius:var(--r-l);background:var(--chip)}
.frow{display:grid;grid-template-columns:56px 1fr;gap:6px;align-items:start}
.flab{font-size:11px;font-weight:700;color:var(--ink2);letter-spacing:.06em;padding-top:5px}
.ffilter .chip{background:var(--panel)}
.ffilter .chip[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
.chip small{margin-left:4px;font-family:var(--f-num);font-size:12px;opacity:.7}
.chip.zero{opacity:.4}
.fhead{display:flex;justify-content:space-between;align-items:center;margin:8px 0 6px}
.shoprow{align-items:flex-start}
.pr-p{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;font-variant-numeric:tabular-nums}
.pz b{font-weight:700;color:var(--ink2);margin-right:4px}
.pr-tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:2px}
.tag{font-size:11px;padding:1px 7px;border-radius:999px;border:1px solid var(--rule);color:var(--ink2)}
.tag.aw{border-color:var(--accent);color:var(--accent)}
.ptable{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ptable>div{background:var(--chip);border-radius:var(--r);padding:8px 10px;display:flex;flex-direction:column}
.ptable b{font-size:11px;color:var(--ink2);letter-spacing:.1em}
.ptable span{font-family:var(--f-num);font-size:16px;font-variant-numeric:tabular-nums}
.ptable small{font-size:11px;color:var(--ink2)}
.sdesc{line-height:1.85}
.menulist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.menulist li{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px dashed var(--rule);font-size:13px}
.menulist li span{min-width:0;overflow-wrap:anywhere}
.menulist li b{font-weight:400;font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--ink2)}
#toast{position:fixed;z-index:900;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 104px);background:var(--ink);color:var(--panel);padding:10px 14px;border-radius:var(--r);font-size:13px;max-width:calc(100% - 32px);box-sizing:border-box;box-shadow:var(--shadow)}
@media (pointer:coarse){input,textarea{font-size:16px!important}}
#loaderr{position:fixed;inset:auto 16px 50% 16px;z-index:999;background:var(--panel);padding:16px;border-radius:var(--r-l);box-shadow:var(--shadow)}
.muni-flash{animation:muniflash 1.1s ease-out}
@keyframes muniflash{0%{fill:var(--accent);stroke-width:5px}40%{fill:var(--accent)}100%{fill:var(--muni-sel);stroke-width:2px}}
.sgallery{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.sgallery .gph{aspect-ratio:4/3;position:relative}
.sgallery .gph .mine{position:absolute;left:6px;bottom:6px;font-size:11px;padding:1px 6px;border-radius:999px;background:rgba(0,0,0,.6);color:#fff}
.credit{font-size:11px;color:var(--ink2);margin:6px 0 0;line-height:1.6;overflow-wrap:anywhere}
.addmine{display:block;text-align:center;box-sizing:border-box;cursor:pointer;margin-top:8px}
#maponly{position:fixed;z-index:700;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 28px);color:var(--ink);display:flex;gap:4px;align-items:center}
@media (max-width:859px){body:not(.maponly) #maponly{bottom:auto;top:calc(env(safe-area-inset-top,0px) + 178px)}}
body.maponly #panel,body.maponly #top{display:none}
body.startclean #walkbar,body.startclean #dotkind{display:none!important}   /* 起動直後は、地図だけ(操作すると、ほかのボタンも出る) */
body.maponly .leaflet-top.leaflet-right{top:calc(env(safe-area-inset-top,0px) + 10px)}
.stars{color:var(--want);letter-spacing:1px;font-size:13px}.stars i{font-style:normal;color:var(--rule)}
.starin{display:flex;align-items:center;gap:2px;margin-top:4px}
.starin button[data-star]:not(.back){border:0;background:none;font-size:28px;line-height:1;padding:2px 3px;color:var(--rule)}
.starin button[aria-pressed="true"]{color:var(--want)}
.tagadd{display:flex;gap:8px}.tagadd input{flex:1}.tagadd .ghost{width:auto;margin-top:0;padding:6px 14px}

/* ===== v8: 地図アプリ寄りの素直な見た目 =====
   PCはパネルを左端に固定、スマホは下からのシート。影はパネルと検索バーだけ、角丸は4〜8px。
   表示だけの情報は文字で、押せるものだけ枠を付ける。操作色は青1色、路線色は線と駅番号だけ。 */
:root{--accent:#2860A8;--panel:#FFFFFF;--sea:#E6EAEC;--rule:#DDE2E5;--chip:#F1F3F4;--ink2:#5F6B71;
  --shadow:0 1px 3px rgba(20,30,40,.18),0 2px 8px rgba(20,30,40,.08);--r:8px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--accent:#8AB4F0;--panel:#1E2427;--sea:#0F1315;--rule:#323B40;--chip:#283034;--ink2:#9AA6AB;--shadow:0 1px 3px rgba(0,0,0,.5),0 2px 10px rgba(0,0,0,.3)}}
:root[data-theme="dark"]{--accent:#8AB4F0;--panel:#1E2427;--sea:#0F1315;--rule:#323B40;--chip:#283034;--ink2:#9AA6AB;--shadow:0 1px 3px rgba(0,0,0,.5),0 2px 10px rgba(0,0,0,.3)}

/* 上部：検索バー1本＋その下に平らな切り替え */
.search{display:flex;align-items:center;background:var(--panel);border-radius:var(--r);box-shadow:var(--shadow);padding-left:12px}
.search input{border:0;box-shadow:none;background:none;border-radius:0;padding:11px 12px 11px 10px}
.search input:focus-visible{outline:none}
.search:focus-within{outline:2px solid var(--accent);outline-offset:0}
.brandmark{display:flex;gap:2px;flex:none}.brandmark i{width:4px;height:18px;border-radius:2px;background:var(--jy)}.brandmark i+i{background:var(--jc)}
#results{border-radius:var(--r)}
.row2{gap:6px}
.seg{box-shadow:none;background:none;padding:0;gap:6px}
.seg button,.pill-btn{background:var(--panel);border:1px solid var(--rule);border-radius:var(--r-l);padding:5px 12px;font-size:13px;font-weight:700;color:var(--ink);box-shadow:0 1px 2px rgba(20,30,40,.12)}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--panel)}
.pill-btn[aria-pressed="true"]{color:var(--accent);border-color:var(--accent)}
#townbar .brand{background:var(--panel);box-shadow:0 1px 2px rgba(20,30,40,.12);border:1px solid var(--rule);border-radius:var(--r-l);padding:5px 12px;font-family:var(--f-body);font-weight:700;font-size:14px;letter-spacing:0}

/* パネル */
#panel{border-radius:var(--r-l) 12px 0 0}
.tabs button{font-size:14px;padding:10px 0 9px;border-bottom-width:2px}
.tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
@media (min-width:860px){
  #panel{left:0;top:0;bottom:0;width:384px;border-radius:0;box-shadow:1px 0 0 var(--rule),2px 0 12px rgba(20,30,40,.08);padding-top:env(safe-area-inset-top,0px)}
  #top{left:400px;top:calc(env(safe-area-inset-top,0px) + 12px)}
  .search{max-width:440px}
  .row1{max-width:440px}
}

/* 見出しと本文 */
h2.st-name{font-family:var(--f-body);font-weight:700;font-size:26px;letter-spacing:0}
.pin-title{font-family:var(--f-body);font-weight:700;font-size:20px}
.prompt{font-family:var(--f-body);font-weight:700;font-size:20px}
.mode b{font-family:var(--f-body);font-size:14px}
.sec h3,.group h3,.rec label,.pform label{font-size:13px;letter-spacing:0;color:var(--ink);font-weight:700}
.tm-label{letter-spacing:0;font-weight:400}

/* 表示だけの情報はチップにせず文字で */
.meta{gap:0}
.meta .chip{background:none;padding:0;border-radius:0;font-size:13px;color:var(--ink2)}
.meta .chip+.chip::before{content:"|";margin:0 8px;color:var(--rule)}

/* 押せるもの */
.chip{border-radius:var(--r-l)}
button.chip,.chips .chip{background:var(--panel);border:1px solid var(--rule);color:var(--ink)}
button.chip[aria-pressed="true"],.ffilter .chip[aria-pressed="true"]{background:color-mix(in srgb,var(--accent) 12%,var(--panel));border-color:var(--accent);color:var(--accent)}
.ffilter{background:none;padding:0;border-radius:0}
.ffilter .chip{background:var(--panel)}
.primary{background:var(--accent);color:var(--panel);border-radius:var(--r)}
.ghost,.tog,.mode,.opt,.stlist button,.reclist button,.pinrow,.navrow button,.spots li{border-width:1px;border-radius:var(--r)}
.note,.qtext,.fb,.pickmsg,.empty{border-radius:var(--r)}
.empty{border-style:solid}
.ptable>div{border-radius:var(--r)}
.back{color:var(--accent)}

/* 地図上の印 */
.leaflet-tooltip.st-label{font-family:var(--f-body);font-weight:700}
.recm{width:14px;height:14px;border-radius:50%;background:var(--rc);border:2px solid var(--panel);box-shadow:0 1px 3px rgba(0,0,0,.35)}
.recm span{display:none}
.recthumb{border-width:1px!important;border-radius:var(--r)!important}
.pinm{width:26px;height:26px}
#toast{border-radius:var(--r)}
#btn-fac{display:none!important}
.askbk{position:fixed;inset:0;z-index:3000;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px}
.askbx{background:var(--panel);color:var(--ink);border-radius:var(--r-l);padding:18px;max-width:420px;width:100%;box-shadow:var(--shadow);max-height:88vh;overflow:auto}
.askbx p{margin:0 0 14px;font-size:16px;line-height:1.6}.askbt{display:flex;gap:10px;justify-content:flex-end;margin-top:12px}
.askbt button,.locbx button{padding:10px 18px;border-radius:var(--r);font:inherit;font-weight:700;border:1px solid var(--rule);background:var(--chip);color:var(--ink)}
.askbt .primary,.locbx .primary{background:var(--accent);color:#fff;border-color:transparent}
.guidebx h2{margin:0 0 4px;font-size:20px}.grow{display:flex;gap:12px;align-items:center;padding:8px 0;border-top:1px solid var(--rule);font-size:14px;line-height:1.5}
.gi{flex:none;width:44px;height:36px;display:grid;place-items:center;border-radius:var(--r);background:var(--chip);color:var(--ink)}
.gi svg{width:20px;height:20px}.locbx{margin-top:12px;padding:12px;border-radius:var(--r);background:var(--chip)}.locbx p{font-size:13px;margin:4px 0 10px}
.guidebx .qs{font-size:13px;line-height:1.55;margin:0 0 8px}.guidebx .grow{font-size:13.5px}.guidebx .askbt{position:sticky;bottom:-18px;background:var(--panel);padding:10px 0 4px;margin:0}
.telrow{margin:6px 0 8px}.telbtn{display:inline-flex;flex-direction:column;gap:2px;padding:9px 16px;border-radius:var(--r);background:var(--accent);color:#fff!important;font-weight:700;text-decoration:none;font-size:16px;line-height:1.3}.telbtn small{font-weight:400;font-size:11px;opacity:.9}
.tabs{align-items:flex-end}
.tabs #tab-zukan{flex:1 1 auto;font-size:16px}
.tabs #tab-quiz,.tabs #tab-rec{flex:0 0 auto;padding:10px 12px;font-size:12px;font-weight:500;color:var(--ink2)}
.coord h2{margin:0 0 10px;font-size:20px}
.coord .step{display:flex;align-items:center;gap:8px;margin:14px 0 8px;font-size:14px}
.coord .no{width:22px;height:22px;border-radius:50%;background:var(--accent);color:#fff;font:700 13px var(--f-num);display:grid;place-items:center}
.goal{display:flex;flex-direction:column;gap:8px}
.goto{display:grid;grid-template-columns:1fr;gap:2px;text-align:left;padding:12px 14px;border:1px solid var(--rule);border-radius:var(--r);background:var(--panel);min-height:var(--tap)}
.goto .gt{font-weight:700;font-size:16px}.goto .gt small{margin-left:8px;font-weight:400;font-size:12px;color:var(--ink2)}
.goto .gw{font-size:13px;color:var(--accent);font-weight:700}.goto .gm{font-size:12px;color:var(--ink2)}
details.more{margin-top:18px;border-top:1px solid var(--rule);padding-top:10px}
details.more summary{cursor:pointer;font-weight:700;font-size:14px;color:var(--ink2);padding:8px 0;min-height:var(--tap);display:flex;align-items:center}
.walkstart{background:var(--panel)!important;color:var(--ink)!important;border:1px solid var(--rule)!important;font-size:13px!important;padding:8px 14px!important;border-radius:999px!important;box-shadow:var(--shadow)}
.walkstart::before{content:"🚶 "}
.gi{width:56px;height:40px;flex:none;display:grid;place-items:center;text-align:center;line-height:1.2}
.gi svg{display:block;margin:auto}.gi b{white-space:nowrap}
.grow{align-items:center}.grow>span:last-child{flex:1;min-width:0}
:root[data-theme="dark"] .leaflet-lowtile-pane img{filter:invert(.92) hue-rotate(180deg) brightness(.82) contrast(.9) saturate(.7)}
.leaflet-lowtile-pane{opacity:.8;filter:saturate(.55)}
@keyframes panelin{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:none}}
@keyframes topin{from{opacity:0;transform:translateY(-14px)}to{opacity:1;transform:none}}
body.panelfade #panel{animation:panelin 1.6s cubic-bezier(.2,.7,.2,1) both}
body.panelfade #top,body.panelfade #walkbar{animation:topin 1.6s cubic-bezier(.2,.7,.2,1) both}
.sb-h2{margin:10px 0 6px;font-weight:700;font-size:13px;color:var(--ink2)}
.fpin{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;color:#fff;font:700 14px var(--f-disp);border:2px solid #fff;box-shadow:0 1px 5px rgba(0,0,0,.45);transform:scale(var(--zs,1));box-sizing:border-box}
.fpin.big{width:34px;height:34px;font-size:17px;border-radius:50% 50% 50% 4px;border-width:2.5px}

const qi=document.getElementById('q'),res=document.getElementById('results');
// v22: 駅だけでなく、店・遊び場も名前とジャンルで探せる（ひらがな・カタカナ・大文字小文字の違いは無視）
const norm=s=>String(s||'').toLowerCase().normalize('NFKC').replace(/[\u3041-\u3096]/g,c=>String.fromCharCode(c.charCodeAt(0)+96)).replace(/[\s・･]/g,'');
let SIDX=null;
function searchIdx(){return SIDX||(SIDX={sh:SHOPS.map(s=>[norm(s.n),norm(s.g+(BIGNAME[s.big]||'')),s]),pl:PLAYS.map(p=>[norm(p.n),norm(p.g+(PBIGNAME[p.big]||'')),p])});}
function searchHits(v){
  const q=norm(v),I=searchIdx();if(!q)return null;
  const st=STATIONS.filter(s=>norm(s.n).includes(q)||norm(s.k).includes(q)||norm(s.m).includes(q));
  const pick=a=>a.filter(x=>x[0].includes(q)||x[1].includes(q)).sort((x,y)=>(y[0].includes(q)-x[0].includes(q))||(x[0].indexOf(q)-y[0].indexOf(q))).map(x=>x[2]);
  return {st,sh:pick(I.sh),pl:pick(I.pl)};
}
qi.oninput=()=>{const v=qi.value.trim();if(!v){res.hidden=true;return;}
  const h=searchHits(v),N=8,more=(n,k)=>n>N?`<div class="rmore">ほか${n-N}件（もう少し詳しく入力してください）</div>`:'';
  const grp=(t,a,row,k)=>a.length?`<div class="rgroup">${t}<small>${a.length}</small></div>${a.slice(0,N).map(row).join('')}${more(a.length,k)}`:'';
  res.innerHTML=(h.st.length+h.sh.length+h.pl.length)?
    grp('駅',h.st,s=>`<button data-st="${s.n}"><b>${s.n}</b><small>${s.k}・${s.m}</small></button>`)+
    grp('食事',h.sh,s=>`<button data-sshop="${s.id}"><b>${esc(s.n)}</b><small>${s.town}・${esc(s.g)}${markTag(s.id)}</small></button>`)+

    :'<div class="empty" style="border:0">見つかりませんでした</div>';
  res.hidden=false;
  const done=()=>{res.hidden=true;qi.value='';qi.blur();};
  res.querySelectorAll('[data-st]').forEach(b=>b.onclick=()=>{done();openStation(b.dataset.st);});
  res.querySelectorAll('[data-sshop]').forEach(b=>b.onclick=()=>{done();openShop(b.dataset.sshop);});

// ---------- クイズ ----------
const MODES={feat:{t:'特徴当て',d:'街の説明文から、駅名を4択で'},spot:{t:'見どころ当て',d:'見どころの一覧から、駅名を4択で'},hist:{t:'成り立ち当て',d:'成り立ち・地名の説明から、駅名を4択で'},mix:{t:'ミックス',d:'3種類からランダムに出題'}};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;};
function km(a,b){const R=6371,r=Math.PI/180,dl=(b[0]-a[0])*r,dn=(b[1]-a[1])*r,x=Math.sin(dl/2)**2+Math.cos(a[0]*r)*Math.cos(b[0]*r)*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(x));}
function mask(s){let t=s.d;[s.n,...(s.x||[])].sort((a,b)=>b.length-a.length).forEach(w=>{t=t.split(w).join('○○');});return t;}
let guessLayer=L.layerGroup().addTo(map);
function clearGuess(){guessLayer.clearLayers();}

function startQuiz(mode){
  const qs=shuffle(pool()).slice(0,5).map(s=>{
    const m=mode==='mix'?['feat','spot','hist'][Math.random()*3|0]:mode;
    const opts=shuffle([s.n,...shuffle(pool().filter(x=>x.n!==s.n)).slice(0,3).map(x=>x.n)]);
    return {s,m,opts,score:null};
  });
  quiz={mode,qs,i:0,answered:false};sel=null;
  renderQuiz();
}
// 問題文の中の駅名（と別名）を「○○」に伏せる
function maskT(s,txt){let t=txt||'';[s.n,...(s.x||[])].sort((a,b)=>b.length-a.length).forEach(w=>{t=t.split(w).join('○○');});return t;}
function curQ(){return quiz.qs[quiz.i];}
function renderQuiz(){
  if(!quiz){
    body.innerHTML=`<p class="lead">1回5問、各100点。出題範囲は上の路線切替（${line==='all'?'全部':LN[line].name}）に合わせます。</p>
    <div class="modes">${Object.entries(MODES).map(([k,v])=>`<button class="mode" data-m="${k}"><b>${v.t}</b><small>${v.d}</small><span class="best">${S.best[k]!=null?'ベスト '+S.best[k]+' / 500':'未挑戦'}</span></button>`).join('')}</div>
    ${weakList()}`;
    body.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>startQuiz(b.dataset.m));
    body.querySelectorAll('[data-st]').forEach(b=>b.onclick=()=>openStation(b.dataset.st));
    styleMarkers();return;
  }
  if(quiz.i>=quiz.qs.length) return renderResult();
  const q=curQ(),s=q.s,total=quiz.qs.reduce((a,x)=>a+(x.score||0),0);
  let html=`<div class="qhead"><span>${MODES[quiz.mode].t}</span><span><span class="qnum">${quiz.i+1}</span> / 5　計 <span class="qnum">${total}</span></span></div>`;
  {
    const txt=q.m==='spot'?`見どころ：${s.s.map(x=>maskT(s,x)).join('　/　')}`:q.m==='hist'?maskT(s,s.h):mask(s);
    const ask=q.m==='spot'?'この見どころがある駅は？':q.m==='hist'?'この成り立ちの駅は？':'○○に入る駅は？';
    html+=`<div class="qtext">${txt}</div><p class="qs" style="margin:0">${ask}</p>`;
    html+=`<div class="opts">${q.opts.map(o=>{let c='';if(quiz.answered){if(o===s.n)c='right';else if(o===q.pick)c='wrong';}
      return `<button class="opt ${c}" data-o="${o}" ${quiz.answered?'disabled':''}>${o}</button>`;}).join('')}</div>`;
    if(quiz.answered) html+=`<div class="fb">${q.score?'正解！':'残念。正解は「'+s.n+'」'}</div>`;
  }
  if(quiz.answered) html+=`<button class="primary" id="next">${quiz.i<4?'次の問題':'結果を見る'}</button><button class="ghost" id="peek" aria-expanded="false">この街の解説を読む</button><div id="peekbox" hidden><div class="sec"><h3>どんな街か</h3><p>${s.d}</p></div><div class="sec"><h3>成り立ち・地名${s.hc?'<span class="flag">諸説あり</span>':''}</h3><p>${s.h}</p></div></div>`;
  html+=`<button class="ghost" id="quit">やめる</button>`;
  body.innerHTML=html;
  body.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>answerChoice(b.dataset.o));
  const nx=body.querySelector('#next');if(nx)nx.onclick=()=>{quiz.i++;quiz.answered=false;clearGuess();renderQuiz();};
  const pk=body.querySelector('#peek');if(pk)pk.onclick=()=>{const bx=body.querySelector('#peekbox');bx.hidden=!bx.hidden;pk.setAttribute('aria-expanded',!bx.hidden);pk.textContent=bx.hidden?'この街の解説を読む':'解説を閉じる';};
  body.querySelector('#quit').onclick=()=>{quiz=null;clearGuess();renderQuiz();};
  styleMarkers();zoomLabels();refreshPins();refreshRecs();
}
function fbPos(q){return `<div class="fb">ずれ <b>${q.dist.toFixed(1)}</b> km　→　<b>${q.score}</b> 点<br><span class="qs">${q.s.m}・${q.s.c}</span></div>`;}
function stat(n,ok){const x=S.qs[n]||(S.qs[n]={ok:0,ng:0});ok?x.ok++:x.ng++;}
function answerChoice(o){const q=curQ(),ans=q.s.n;q.pick=o;q.score=o===ans?100:0;stat(q.s.n,!!q.score);quiz.answered=true;save();
  sel=null;styleMarkers();focusOn(q.s.ll,Math.max(map.getZoom(),12.5));renderQuiz();}
map.on('click',e=>{
  if(pinView&&pinView.mode==='pick'){pickAt(e.latlng);return;}
  if(!quiz||quiz.answered||quiz.i>=5||curQ().m!=='pos')return;
  const q=curQ(),g=[e.latlng.lat,e.latlng.lng];q.dist=km(g,q.s.ll);q.score=Math.max(0,Math.round(100*(1-q.dist/4)));
  stat(q.s.n,q.score>=60);quiz.answered=true;save();
  L.polyline([g,q.s.ll],{pane:'guess',color:css('--ink'),weight:2,dashArray:'4 6'}).addTo(guessLayer);

// 詳細地図（建物・道路・公園・川）。tiles/ の区画ファイルを、表示している範囲だけ読み込む
// v13: 図形を地図に直接載せると動かすたびに全部を描き直して固まるため、256pxの画像タイル（GridLayer）に一度だけ描いて使い回す。
//      区画の図形は読み込み時に一度だけ座標を展開し、小さな格子で索引を付けて、タイルに必要な分だけ描く。描画は少しずつ分けて進める
const TILESET=new Set(TILE_KEYS),TDLAT=.025,TDLNG=.03125,DETAIL_Z=14,SPOT_Z=15,TGRID=8;

// v18: 描き終えたタイルを覚えておき、同じ場所・同じ拡大率に戻ったらすぐ出す（拡大縮小で毎回描き直さない）
const tileCache=new Map(),TC_MAX=120;

const tcPut=(k,v)=>{tileCache.set(k,v);while(tileCache.size>TC_MAX)tileCache.delete(tileCache.keys().next().value);};
// 区画の図形を、緯度経度の配列（Float64Array：lat,lng,lat,lng…）と外接矩形に展開して、格子ごとに振り分ける
function indexTile(k,D){
  const [i,j]=k.split('_').map(Number),o0=i*TDLAT,o1=j*TDLNG,R={};
  for(const n of DKINDS){
    const fs=D[n]||[],items=[],cells=Array.from({length:TGRID*TGRID},()=>[]);
    for(const f of fs){
      const a=new Float64Array(f.length);let x=0,y=0,s=90,w=180,nn=-90,ee=-180;
      for(let q=0;q<f.length;q+=2){x+=f[q];y+=f[q+1];const la=o0+y/1e5,lo=o1+x/1e5;a[q]=la;a[q+1]=lo;if(la<s)s=la;if(la>nn)nn=la;if(lo<w)w=lo;if(lo>ee)ee=lo;}
      const it={a,s,w,n:nn,e:ee,id:items.length};items.push(it);
      const ci=v=>Math.max(0,Math.min(TGRID-1,Math.floor(v)));
      for(let r=ci((s-o0)/TDLAT*TGRID);r<=ci((nn-o0)/TDLAT*TGRID);r++)for(let c=ci((w-o1)/TDLNG*TGRID);c<=ci((ee-o1)/TDLNG*TGRID);c++)cells[r*TGRID+c].push(it);
    }

// v24: 区画データの展開を、少しずつ分けて進める（1つの区画で数百ミリ秒止まるため）
function indexTileAsync(k,D,done){
  const [i,j]=k.split('_').map(Number),o0=i*TDLAT,o1=j*TDLNG,R={};
  let ki=0,fi=0,cur=null;
  const ci=v=>Math.max(0,Math.min(TGRID-1,Math.floor(v)));
  const step=()=>{
    const t0=performance.now();
    while(ki<DKINDS.length){
      const n=DKINDS[ki],fs=D[n]||[];
      if(!cur){cur={items:[],cells:Array.from({length:TGRID*TGRID},()=>[])};fi=0;}
      const items=cur.items,cells=cur.cells;
      while(fi<fs.length){
        const f=fs[fi++];
        const a=new Float64Array(f.length);let x=0,y=0,s=90,w=180,nn=-90,ee=-180;
        for(let q=0;q<f.length;q+=2){x+=f[q];y+=f[q+1];const la=o0+y/1e5,lo=o1+x/1e5;a[q]=la;a[q+1]=lo;if(la<s)s=la;if(la>nn)nn=la;if(lo<w)w=lo;if(lo>ee)ee=lo;}
        const it={a,s,w,n:nn,e:ee,id:items.length};items.push(it);
        for(let r=ci((s-o0)/TDLAT*TGRID);r<=ci((nn-o0)/TDLAT*TGRID);r++)for(let c=ci((w-o1)/TDLNG*TGRID);c<=ci((ee-o1)/TDLNG*TGRID);c++)cells[r*TGRID+c].push(it);
        if(performance.now()-t0>10){setTimeout(step,0);return;}
      }
      R[n]=cur;cur=null;ki++;

}
window.ENSEN_TILE=(k,D)=>indexTileAsync(k,D,T=>{tileData[k]=T;tileState[k]='ok';(tileWait[k]||[]).forEach(f=>f());delete tileWait[k];});
// v24: 見えている範囲より広く先読みする。区画データは周囲の8区画、地図の絵は上下左右に1枚ぶん外側まで
function prefetchTiles(){

  const c=map.getCenter(),i=Math.floor(c.lat/TDLAT),j=Math.floor(c.lng/TDLNG);

}
map.on('moveend zoomend',()=>{(window.requestIdleCallback||(f=>setTimeout(f,200)))(prefetchTiles);});
function loadTile(k,cb){

  sc.onerror=()=>{tileState[k]='err';(tileWait[k]||[]).forEach(f=>f());delete tileWait[k];if(!loadTile.warned){loadTile.warned=1;toast('詳細地図のデータを読み込めませんでした。index.html と同じ場所に tiles フォルダがあるか確認してください');}};

// 描く順番と見た目（道路は縁取り→本体の順）
const dStyleMemo={};
function dStyles(z){if(dStyleMemo[z])return dStyleMemo[z];return dStyleMemo[z]=dStyles0(z);}
function dStyles0(z){
  const b=z>=17;
  return [['g','fill',{f:css('--park')}],['w','fill',{f:css('--water')}],['wl','line',{c:css('--water'),lw:4}],
    ['r2','line',{c:css('--bldgline'),lw:6}],['r1','line',{c:css('--bldgline'),lw:9}],['r3','line',{c:css('--road'),lw:2.5}],

// 描画待ちのタイルを、1フレーム約8msずつ処理する（固まらないように）
const drawQ=[];let drawing=false;

  if(drawing)return;drawing=true;
  const step=()=>{const t0=performance.now();
    while(drawQ.length&&performance.now()-t0<8){const job=drawQ[0];if(job.run()){drawQ.shift();}}
    if(drawQ.length)requestAnimationFrame(step);else drawing=false;};
  requestAnimationFrame(step);
}
const DetailLayer=L.GridLayer.extend({
  // 見えている範囲より1枚ぶん外側まで読み込んで、地図を動かしたときに待たせない（v24）
  _getTiledPixelBounds(center){const b=L.GridLayer.prototype._getTiledPixelBounds.call(this,center),s=this.getTileSize();return L.bounds(b.min.subtract(s),b.max.add(s));},
  createTile(co,done){
    if(!window.__bootOver){const e=document.createElement('canvas');setTimeout(()=>done(null,e),0);return e;}   // 起動の演出中は、重い詳細地図を作らない(終わってから描き直す)
    const ck='d'+co.z+'/'+co.x+'/'+co.y,hit=tcGet(ck);if(hit&&!hit.isConnected){setTimeout(()=>done(null,hit),0);return hit;}
    const size=this.getTileSize(),dpr=Math.min(co.z>=16?3:2,window.devicePixelRatio||1),cv=document.createElement('canvas');cv._ck=ck;
    cv.width=size.x*dpr;cv.height=size.y*dpr;
    const nw=map.unproject(co.scaleBy(size),co.z),se=map.unproject(co.add([1,1]).scaleBy(size),co.z);
    const keys=[];for(let i=Math.floor(se.lat/TDLAT);i<=Math.floor(nw.lat/TDLAT);i++)for(let j=Math.floor(nw.lng/TDLNG);j<=Math.floor(se.lng/TDLNG);j++){const k=i+'_'+j;if(TILESET.has(k))keys.push(k);}
    if(!keys.length){setTimeout(()=>done(null,cv),0);return cv;}
    let left=keys.length;
    const ready=()=>{if(--left>0)return;drawQ.push(makeJob(cv,co,size,dpr,keys,nw,se,done));pumpDraw();};
    keys.forEach(k=>loadTile(k,ready));
    return cv;

});
// 1枚のタイルを、図形の種類ごとに少しずつ描く仕事
function makeJob(cv,co,size,dpr,keys,nw,se,done){
  const ctx=cv.getContext('2d'),z=co.z,sc=256*Math.pow(2,z),ox=co.x*size.x,oy=co.y*size.y;
  const px=lo=>(lo+180)/360*sc-ox,py=la=>{const s=Math.sin(la*Math.PI/180);return (.5-Math.log((1+s)/(1-s))/(4*Math.PI))*sc-oy;};
  ctx.scale(dpr,dpr);ctx.lineCap='round';ctx.lineJoin='round';
  const st=dStyles(z),m=(se.lat-nw.lat)*.02,pxLng=size.x/(se.lng-nw.lng),pxLat=size.y/(nw.lat-se.lat),tiny=z<16;let si=0;
  const feats=n=>{const out=[],seen=new Set();for(const k of keys){const T=tileData[k];if(!T)continue;const L2=T.R[n];
    const r0=Math.max(0,Math.floor((se.lat-T.o0)/TDLAT*TGRID)),r1=Math.min(TGRID-1,Math.floor((nw.lat-T.o0)/TDLAT*TGRID)),c0=Math.max(0,Math.floor((nw.lng-T.o1)/TDLNG*TGRID)),c1=Math.min(TGRID-1,Math.floor((se.lng-T.o1)/TDLNG*TGRID));

  // v24: 1回の仕事で描く量を頂点数で区切る（建物などが多い種類を一度に描くと、1回で数百ミリ秒止まるため）

    const [n,kind,o]=st[si];
    if(!cur){cur=feats(n);fo=0;}
    ctx.beginPath();
    for(let v=0;fo<cur.length&&v<CHUNK;){const a=cur[fo++].a;ctx.moveTo(px(a[1]),py(a[0]));for(let q=2;q<a.length;q+=2)ctx.lineTo(px(a[q+1]),py(a[q]));if(kind==='fill')ctx.closePath();v+=a.length>>1;}
    if(kind==='fill'){ctx.fillStyle=o.f;ctx.fill();if(o.c){ctx.strokeStyle=o.c;ctx.lineWidth=o.lw;ctx.stroke();}}
    else{ctx.strokeStyle=o.c;ctx.lineWidth=o.lw;ctx.setLineDash(o.dash||[]);ctx.stroke();ctx.setLineDash([]);}
    if(fo>=cur.length){cur=null;si++;}
    return false;}};
}

async function savePin(d){
  await persistPin(d);
  cancelDraft();refreshPins();pinView={mode:'detail',id:d.id};render();body.scrollTop=0;toast('保存しました');
}
async function persistPin(d){
  const old=d.id?PINS.find(x=>x.id===d.id):null;
  const added=[];for(const a of d.add){const id=newId('ph');await store('put','photos',{id,blob:a.blob});photoURL[id]=a.url;added.push(id);}
  const pin={id:d.id||newId('pin'),town:d.town,lat:+d.lat.toFixed(6),lng:+d.lng.toFixed(6),title:d.title.trim(),kind:d.kind,comment:d.comment.trim(),date:d.date,stars:d.stars||0,tags:(d.tags||[]).slice(),photos:[...d.keep,...added],from:d.from||(old&&old.from)||null,created:old?old.created:Date.now(),updated:Date.now()};
  await store('put','pins',pin);
  if(old){for(const id of old.photos)if(!pin.photos.includes(id)){await store('del','photos',id);if(photoURL[id]){URL.revokeObjectURL(photoURL[id]);delete photoURL[id];}}}
  PINS=PINS.filter(x=>x.id!==pin.id).concat(pin);
  try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist();}catch(e){}
  d.id=pin.id;if(typeof fbSoon==='function')fbSoon();return pin;
}
async function deletePin(p){
  S.del=S.del||{};S.del[p.id]=Date.now();p.photos.forEach(id=>S.del[id]=Date.now());save();
  for(const id of p.photos){await store('del','photos',id);if(photoURL[id]){URL.revokeObjectURL(photoURL[id]);delete photoURL[id];}}
  await store('del','pins',p.id);PINS=PINS.filter(x=>x.id!==p.id);
}

  return (PHOTOS[id]||[]).map((x,i)=>({cp:id,ci:i,cap:`写真：${x.a}／${x.l}（Wikimedia Commons）`})).concat(pin?pin.photos.map(ph=>({photo:ph,cap:'自分の写真',mine:1})):[]);}

  return `<div class="sec"><h3>写真</h3>${it.length?`<div class="sgallery">${it.map((x,i)=>`<button class="gph" data-sview="${i}" aria-label="写真${i+1}を拡大">${x.cp?`<img data-cp="${x.cp}" data-ci="${x.ci}" alt="">`:`<img data-photo="${x.photo}" alt="">`}${x.mine?'<span class="mine">自分</span>':''}</button>`).join('')}</div>`
    :`<div class="empty">${PHOTOS_CHECKED?'自由に使える写真が見つからなかった場所です。':'写真は準備中です。'}行ったときに撮った写真を追加できます。</div>`}
  ${cc.length?`<p class="credit">${cc.map((x,i)=>`${i+1}. ${esc(x.a)}／${esc(x.l)}`).join('　')}（Wikimedia Commons）</p>`:''}
  <label class="ghost addmine">＋ 自分の写真を追加<input type="file" accept="image/*" multiple hidden data-addphoto></label></div>`;}
function wireSpotPhotos(spot,mk){
  hydrate(body);const it=spotPhotos(spot.id);
  if(PHOTOS[spot.id])loadPics(spot.id,()=>body.querySelectorAll(`img[data-cp="${spot.id}"]`).forEach(im=>{im.src=picData[spot.id][+im.dataset.ci];}));
  body.querySelectorAll('[data-sview]').forEach(b=>b.onclick=()=>openViewer(it.map(x=>({src:x.cp?(picData[x.cp]||[])[x.ci]:null,photo:x.photo,cap:spot.n+'　'+x.cap})),+b.dataset.sview));
  const inp=body.querySelector('[data-addphoto]');if(!inp)return;
  inp.onchange=async()=>{const files=[...inp.files];if(!files.length)return;
    try{const add=[];for(const f of files){const blob=await compress(f);add.push({blob,url:URL.createObjectURL(blob)});}
      const old=PINS.find(p=>p.from===spot.id);
      await persistPin(old?Object.assign({},old,{keep:old.photos.slice(),add}):Object.assign(mk(),{id:null,keep:[],add,date:today()}));
      refreshPins();render();toast(`写真を${add.length}枚追加しました${old?'':'（自分のピンとしても保存されます）'}`);}
    catch(e){toast('写真を追加できませんでした');}};
}

// バックアップ
const blobToDataURL=b=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(b);});
async function exportAll(btn){
  btn.disabled=true;btn.textContent='書き出し中…';
  try{
    const photos={};for(const id of [...PINS.flatMap(p=>p.photos),...WALKS.flatMap(w=>w.photos.map(x=>x.id))]){const o=await store('get','photos',id);if(o)photos[id]=await blobToDataURL(o.blob);}
    const data=JSON.stringify({app:'ensen-zukan',version:2,exported:new Date().toISOString(),rec:S.rec,best:S.best,qs:S.qs,pins:PINS,walks:WALKS,photos});
    const name='ensen-zukan-backup-'+today().replace(/-/g,'')+'.json';
    const dl=window.claude&&window.claude.use?await window.claude.use('downloads').catch(()=>null):null;
    if(dl){try{await dl.save({filename:name,data:new Blob([data])});toast('書き出しました');}catch(e){if(e&&e.code!=='declined')toast('書き出せませんでした（'+(e&&e.code||'不明なエラー')+'）');}}
    else{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'application/json'}));a.download=name;document.body.appendChild(a);a.click();a.remove();toast('書き出しました');}
  }catch(e){toast('書き出せませんでした');}
  btn.disabled=false;btn.textContent='バックアップを書き出す';
}
async function importAll(file){
  let d;try{d=JSON.parse(await file.text());}catch(e){toast('ファイルを読み込めませんでした');return;}
  if(!d||d.app!=='ensen-zukan'||!Array.isArray(d.pins)){toast('このアプリのバックアップファイルではありません');return;}
  let np=0,nph=0;
  for(const [id,url] of Object.entries(d.photos||{})){try{const blob=await (await fetch(url)).blob();await store('put','photos',{id,blob});nph++;}catch(e){}}
  for(const p of d.pins){if(!p||!p.id||!BY[p.town]||!KINDS[p.kind])continue;p.photos=(p.photos||[]).filter(id=>d.photos&&d.photos[id]);await store('put','pins',p);PINS=PINS.filter(x=>x.id!==p.id).concat(p);np++;}
  let nw=0;for(const w of (Array.isArray(d.walks)?d.walks:[])){if(!w||!w.id||!Array.isArray(w.pts))continue;w.photos=(w.photos||[]).filter(x=>d.photos&&d.photos[x.id]);w.active=false;await store('put','walks',w);WALKS=WALKS.filter(x=>x.id!==w.id).concat(w);nw++;}refreshWalkAll();
  if(d.rec&&typeof d.rec==='object')Object.entries(d.rec).forEach(([n,r])=>{if(BY[n])S.rec[n]=r;});
  if(d.best)Object.entries(d.best).forEach(([k,v])=>{if(S.best[k]==null||v>S.best[k])S.best[k]=v;});
  save();refreshPins();render();styleMarkers();toast(`読み込みました：ピン${np}件・お散歩${nw}回・写真${nph}枚`);
}
function backupHTML(){

const playSpot=p=>/寺|神社|神宮|稲荷|八幡|天満|名所|史跡|記念碑|展望|教会|聖堂|城/.test(p.g+p.n)&&p.big==='park'?'tour':(PLAY2SPOT[p.big]||'tour');

// v18: 点は一度だけ作って使い回す（以前はズームのたびに約2,300個を作り直していて重かった）
let dotLayer=null,recKey='';
function buildDots(){
  dotLayer=L.layerGroup();const panel=css('--panel'),food=css('--dot-food'),cafe=css('--dot-cafe'),sp={};
  const dot=(ll,col,title,fn)=>{const m=L.circleMarker(ll,{renderer:dotCanvas,pane:'dots',radius:5,color:panel,weight:1.5,fillColor:col,fillOpacity:1,bubblingMouseEvents:false});
    m.bindTooltip(title,{direction:'top',offset:[0,-6]});m.on('click',e=>{if(pinView&&pinView.mode==='pick'){pickAt(e.latlng);return;}fn();});m.addTo(dotLayer);return m;};
  dotAll=[];dotKey='';
  SHOPS.filter(s=>s.ll).forEach(s=>{const m=dot(s.ll,s.big==='cafe'||s.big==='sweets'?cafe:food,s.n,()=>openShop(s.id));m._t='s';m._d=s;dotAll.push(m);});
  PLAYS.filter(p=>p.ll).forEach(p=>{const c=playSpot(p),m=dot(p.ll,sp[c]||(sp[c]=css('--sp-'+c)),p.n,()=>openPlay(p.id));m._t='p';m._d=p;dotAll.push(m);});
}
// v19: 食事・遊び場の条件で絞り込んでいるときは、合う場所だけを大きく目立たせ、ほかの点とおすすめのピンは隠す
let dotAll=[],dotKey='';const selLayer=L.layerGroup().addTo(map);
// 条件を変えたら、合う場所がぜんぶ見える範囲に地図を合わせる
function fitMatches(kind){
  const lls=kind==='food'?SHOPS.filter(s=>s.ll&&shopMatch(s)).map(s=>s.ll):PLAYS.filter(p=>p.ll&&playMatch(p)).map(p=>p.ll);
  if(!lls.length)return;if(lls.length===1){focusOn(lls[0],16);return;}
  const b=L.latLngBounds(lls);map.flyToBounds(b,Object.assign({maxZoom:16,duration:.6},fitPad()));
}
function dotMode(){return town&&townTab==='food'?'food':town&&townTab==='play'?'play':null;}
function styleDots(){
  const mode=dotMode(),sel=pinView&&(pinView.mode==='shop'||pinView.mode==='play')?pinView.id:null;
  const dk=S.ui.dotKind||'all';
  const key=[mode,town,sel,markVer,dk,mode==='food'?JSON.stringify(FF):mode==='play'?JSON.stringify(PF):''].join('|');
  if(key===dotKey||!dotLayer)return;dotKey=key;
  const accent=css('--accent'),panel=css('--panel');
  dotAll.forEach(m=>{
    const d=m._d,ok=!mode?(dk==='all'||(dk==='food'?m._t==='s':m._t==='p')):mode==='food'?m._t==='s'&&shopMatch(d):m._t==='p'&&playMatch(d),isSel=d.id===sel;
    const mk=markOf(d.id),st=(!ok&&!isSel?'off':isSel?'sel':mode?'hi':'n')+(mk?'-'+mk:'');
    if(m._st===st)return;m._st=st;
    if(st.startsWith('off')){if(dotLayer.hasLayer(m))dotLayer.removeLayer(m);return;}
    if(!dotLayer.hasLayer(m))dotLayer.addLayer(m);
    // 行きたい＝金色の太い縁、行った＝濃い縁（印のある点は少し大きく）
    const ring=mk==='w'?{color:css('--want'),weight:3}:mk==='v'?{color:css('--ink'),weight:2.5}:null;
    const K=dsc();
    m.setStyle(st.startsWith('sel')?{radius:10*K,weight:3.5,color:accent}:Object.assign(st.startsWith('hi')?{radius:7.5*K,weight:2.5,color:panel}:{radius:(mk?6.5:5)*K,weight:1.5,color:panel},ring||{}));
    if(!st.startsWith('n')||mk)m.bringToFront();
  });
  // 選んでいる施設には波紋の印
  selLayer.clearLayers();const sd=sel&&dotAll.find(m=>m._d.id===sel);
  if(sd)L.marker(sd.getLatLng(),{icon:L.divIcon({className:'',iconSize:[44,44],iconAnchor:[22,22],html:'<div class="selpulse"></div>'}),interactive:false,keyboard:false,zIndexOffset:-500}).addTo(selLayer);
}
function refreshRecs(){
  const quizOn=!!(quiz&&quiz.i<quiz.qs.length),zz=map.getZoom();
  const show=showRec&&!quizOn&&(!!town||zz>=13),key=show+'|'+season;   // 季節のおすすめのピン
  const showDots=!quizOn&&(!!town||zz>=15);                         // v24: 店・遊び場の点は、拡大15以上では押さなくても出す
  const focus=!!dotMode();
  if(key+focus!==recKey){recKey=key+focus;recLayer.clearLayers();
    if(show&&!focus)recsFor(null).forEach(r=>{const m=L.marker(r.ll,{icon:recIcon(r.cat),title:r.n,bubblingMouseEvents:false,zIndexOffset:-200});
      m.on('click',e=>{if(pinView&&pinView.mode==='pick'){pickAt(e.latlng);return;}openRec(r.id);});m.addTo(recLayer);});}
  if(showDots){if(!dotLayer)buildDots();if(!map.hasLayer(dotLayer))dotLayer.addTo(map);styleDots();}
  else{if(dotLayer&&map.hasLayer(dotLayer))map.removeLayer(dotLayer);selLayer.clearLayers();dotKey='';}
}
map.on('zoomend',refreshRecs);
map.on('zoomend',()=>{document.documentElement.style.setProperty('--zs',dsc().toFixed(2));if(dotLayer&&map.hasLayer(dotLayer)){dotKey='';dotAll.forEach(m=>{m._st=null;});styleDots();}});

const PBIG=[['amuse','アミューズメント'],['stage','映画・ライブ・劇場'],['museum','美術館・博物館'],['shop','店めぐり'],['park','公園・散歩・展望'],['exp','体験'],['sauna','サウナ・銭湯']];
const PBIGNAME=Object.fromEntries(PBIG);
const PBANDS=[['free','無料'],['u1','～999円'],['1','1000円台'],['23','2000〜3000円台'],['4p','4000円〜']];
const PBANDNAME=Object.fromEntries(PBANDS);
S.ui.play=Object.assign({big:null,band:null,night:false,rain:false,scene:null,all:false,sort:'std'},S.ui.play||{});
const PF=S.ui.play;
function playMatch(p,f){
  f=f||PF;
  if(!f.all&&p.town!==town)return false;
  if(f.big&&p.big!==f.big)return false;
  if(f.band&&p.band!==f.band)return false;
  if(f.night&&!p.night)return false;
  if(f.rain&&!p.rain)return false;
  if(f.scene&&!p.sc.includes(f.scene))return false;
  return true;
}
const pCount=(k,v)=>PLAYS.filter(p=>playMatch(p,Object.assign({},PF,{[k]:v}))).length;
function pChipRow(label,key,opts){
  return `<div class="frow"><span class="flab">${label}</span><div class="chips" style="margin:0">${opts.map(([v,t])=>{const c=pCount(key,v);
    return `<button class="chip${c?'':' zero'}" data-pf="${key}" data-v="${v}" aria-pressed="${PF[key]===v}">${t}<small>${c}</small></button>`;}).join('')}</div></div>`;
}
function playHTML(){
  const list=sortList(PLAYS.filter(p=>playMatch(p)),'play');
  const here=PLAYS.filter(p=>p.town===town).length;
  const active=PF.big||PF.band||PF.night||PF.rain||PF.scene;
  return `<div class="ffilter">
    <div class="frow"><span class="flab">範囲</span><div class="chips" style="margin:0"><button class="chip" data-pscope="town" aria-pressed="${!PF.all}">${town}だけ</button><button class="chip" data-pscope="all" aria-pressed="${PF.all}">収録した街すべて</button></div></div>
    ${pChipRow('ジャンル','big',PBIG)}
    ${pChipRow('予算','band',PBANDS)}
    <div class="frow"><span class="flab">条件</span><div class="chips" style="margin:0">
      <button class="chip${pCount('night',true)?'':' zero'}" data-ptog="night" aria-pressed="${PF.night}">夜も遊べる<small>${pCount('night',true)}</small></button>
      <button class="chip${pCount('rain',true)?'':' zero'}" data-ptog="rain" aria-pressed="${PF.rain}">雨の日OK<small>${pCount('rain',true)}</small></button></div></div>
    ${pChipRow('シーン','scene',SCENES)}
  </div>
  ${!here&&!PF.all?`<div class="empty" style="margin-bottom:8px">${town}の遊び場はまだ準備中です。「収録した街すべて」で、ほかの街の遊び場を見られます。</div>`:''}
  <div class="fhead"><b>${list.length}件</b>${active?'<button class="back" id="preset">条件をクリア</button>':''}${sortSel('play')}</div>
  ${hereNote('play')}
  <div class="pinlist">${list.length?list.map(p=>`<button class="pinrow shoprow" data-play="${p.id}">
    <span class="pr-body"><span class="pr-t">${esc(p.n)}${markTag(p.id)}</span>
    <span class="pr-m">${PF.all?p.town+'・':''}${PBIGNAME[p.big]}・${esc(p.g)}${sortInfo(p,'play')}</span>
    <span class="pr-c">${esc(p.price||(p.band?PBANDNAME[p.band]+'（目安）':'料金未確認'))}</span>
    <span class="pr-tags">${p.night?'<span class="tag">夜も</span>':''}${p.rain?'<span class="tag">雨OK</span>':''}${p.sc.map(x=>`<span class="tag">${SCENENAME[x]}</span>`).join('')}</span></span></button>`).join('')
    :'<div class="empty">この条件に合う場所はありません。条件を1つ外してみてください。</div>'}</div>
  <p class="disclaim">料金・営業時間は公式サイトなどで${PLAYS.some(p=>p.ck)?'各施設の確認日':PLAYS_CHECKED}に確認した範囲の情報です。紹介文と利用シーンはClaudeがまとめた目安です。</p>`;
}
function wirePlay(){
  body.querySelectorAll('[data-pf]').forEach(b=>b.onclick=()=>{const k=b.dataset.pf,v=b.dataset.v;PF[k]=PF[k]===v?null:v;S.ui.play=PF;save();render();fitMatches('play');});
  body.querySelectorAll('[data-ptog]').forEach(b=>b.onclick=()=>{const k=b.dataset.ptog;PF[k]=!PF[k];save();render();fitMatches('play');});
  body.querySelectorAll('[data-pscope]').forEach(b=>b.onclick=()=>{PF.all=b.dataset.pscope==='all';save();render();fitMatches('play');});
  const r=body.querySelector('#preset');if(r)r.onclick=()=>{PF.big=PF.band=PF.scene=null;PF.night=PF.rain=false;save();render();};
  wireSort('play');
  body.querySelectorAll('[data-play]').forEach(b=>b.onclick=()=>openPlay(b.dataset.play));
}
function openPlay(id){

}
function renderPlayDetail(){
  const p=PLAYS.find(x=>x.id===pinView.id);if(!p){pinView={mode:'list'};return renderTown();}
  const saved=PINS.find(x=>x.from===p.id);

  body.innerHTML=`<button class="back" id="pd2-back">← 遊び場の一覧</button>
  <div class="meta" style="margin-top:8px"><span class="chip">${PBIGNAME[p.big]}</span><span class="chip">${p.town}</span>${p.night?'<span class="chip">夜も遊べる</span>':''}${p.rain?'<span class="chip">雨の日OK</span>':''}</div>
  <h2 class="pin-title">${esc(p.n)}</h2>
  <p class="qs" style="margin:-4px 0 10px">${esc(p.g)}　｜　${esc(p.st)}</p>
  ${telHTML(p.tel,p.n,p.addr||p.town)}
  ${spotPhotosHTML(p.id)}
  <div class="ptable" style="margin-top:16px"><div><b>料金</b><span style="font-size:14px;font-family:var(--f-body)">${esc(p.price||'未確認')}</span><small>${p.band?PBANDNAME[p.band]+(p.price?'':'（目安）'):''}</small></div><div><b>営業時間</b><span style="font-size:14px;font-family:var(--f-body)">${esc(p.hours||'未確認')}</span></div></div>
  ${p.desc?`<div class="sec"><h3>どんな場所か</h3><p class="sdesc">${esc(p.desc)}</p><p class="qs" style="margin:4px 0 0">${p.auto?'Wikipedia・OpenStreetMapの情報をもとにClaudeがまとめた紹介です。営業時間・料金は確認していません':'公式情報や口コミサイトをもとにClaudeがまとめた紹介です'}（${p.ck||PLAYS_CHECKED}確認）。</p></div>`:`<p class="qs" style="margin:12px 0 0">OpenStreetMapの登録から自動で集めた場所です（${p.ck||PLAYS_CHECKED}時点）。紹介文はまだありません。</p>`}
  ${p.note?`<p class="qs" style="margin:6px 0 0">確認できなかった点：${esc(p.note)}</p>`:''}
  ${p.sc.length?`<div class="sec"><h3>利用シーン（目安）</h3><div class="chips" style="margin:0">${p.sc.map(x=>`<span class="chip">${SCENENAME[x]}</span>`).join('')}</div></div>`:''}
  <div class="sec"><h3>出典・リンク</h3><ul class="links">${p.src.map(l=>`<li><a href="${esc(l.u)}" target="_blank" rel="noopener">${esc(l.t)}</a></li>`).join('')}<li><a href="${gmap}" target="_blank" rel="noopener">Googleマップで場所を確認</a></li></ul></div>
  ${markBtns(p.id)}
  <button class="primary" id="pd2-save">${saved?'保存したピンを開く':'自分のピンに保存（写真・メモを残せる）'}</button>
  <p class="disclaim">料金や営業時間は変わることがあります。出かける前に公式サイトで確認してください。ピンに保存すると駅の位置に置かれるので、編集で正しい場所に動かせます。</p>`;
  const pll=p.ll||BY[p.town].ll,pkind=p.big==='park'?'view':p.big==='shop'?'shop':p.big==='museum'?'hist':'other';
  const pmk=()=>({lat:pll[0],lng:pll[1],title:p.n,kind:pkind,comment:`${PBIGNAME[p.big]}（${p.g}）／${p.price||''}`,date:'',town:p.town,from:p.id});
  wireSpotPhotos(p,pmk);wireMarks(p.id);
  body.querySelector('#sd-share').onclick=()=>share(p.n,`${p.n}（${p.town}・${p.g}）${p.price?'\n料金 '+p.price:''}`,deepLink(p.id),(p.src[0]||{}).u);
  body.querySelector('#pd2-back').onclick=()=>{pinView={mode:'list'};townTab='play';render();};
  body.querySelector('#pd2-save').onclick=async e=>{
    if(saved){townTab='pin';pinView={mode:'detail',id:saved.id};render();body.scrollTop=0;return;}
    e.currentTarget.disabled=true;
    try{await savePin(Object.assign(pmk(),{id:null,keep:[],add:[]}));townTab='pin';}
    catch(err){toast('保存できませんでした');e.currentTarget.disabled=false;}

}


// ---------- 並べ替え・行きたい/行った・現在地・共有（v22） ----------
// 並べ替え：std＝これまでの順（選出実績・評価順に収集した順）、near＝その街の駅から近い順、here＝現在地から近い順
const SORTS={food:[['std','おすすめ順'],['near','駅から近い順'],['here','現在地から近い順']],
  play:[['std','おすすめ順'],['near','駅から近い順'],['cheap','安い順'],['here','現在地から近い順']]};
const BANDRANK={free:0,u1:1,'1':2,'2':3,'23':3.5,'34':4,'4p':5,'5p':5};
var HERE=null,hereLayer=L.layerGroup().addTo(map);
if(FF.sort==='here'||FF.sort==='rt'||FF.sort==='cheap')FF.sort='std';if(PF.sort==='here')PF.sort='std';  // 現在地は保存しないので、開き直したら元の順に
const FL=k=>k==='food'?FF:PF;
const dStation=x=>x.ll?km(x.ll,BY[x.town].ll)*1000:Infinity;
const dHere=x=>x.ll&&HERE?km(x.ll,HERE.ll)*1000:Infinity;
const fmtM=m=>m===Infinity?'位置不明':m<1000?Math.round(m/10)*10+'m':(m/1000).toFixed(1)+'km';
function cheapRank(x,k){
  if(k==='play')return x.band in BANDRANK?BANDRANK[x.band]:9;
  const b=FF.time?x[FF.time]:[x.l,x.d].filter(Boolean).sort((a,c)=>BANDRANK[a]-BANDRANK[c])[0];
  return b in BANDRANK?BANDRANK[b]:9;
}
function sortList(list,k){
  const s=FL(k).sort,by=f=>list.map((x,i)=>[f(x),i,x]).sort((a,b)=>a[0]-b[0]||a[1]-b[1]).map(a=>a[2]);
  if(s==='near')return by(dStation);
  if(s==='here'&&HERE)return by(dHere);
  if(s==='rt')return by(x=>-(x.rt||0));
  if(s==='cheap')return by(x=>cheapRank(x,k));
  return list;
}
function sortInfo(x,k){
  const s=FL(k).sort;
  if(s==='near')return '・駅から'+fmtM(dStation(x));
  if(s==='here'&&HERE)return '・ここから'+fmtM(dHere(x));
  if(s==='rt')return x.rt?'・評価'+x.rt.toFixed(2):'・評価の記録なし';
  return '';
}
const sortSel=k=>`<label class="sortsel"><span class="vh">並び順</span><select id="sort-${k}">${SORTS[k].map(([v,t])=>`<option value="${v}" ${FL(k).sort===v?'selected':''}>${t}</option>`).join('')}</select></label>`;
function hereNote(k){
  const f=FL(k);if(f.sort==='rt')return '<p class="qs" style="margin:0 0 6px">評価は食べログの点数を記録している店（自動で集めた店）だけです。百名店など点数を記録していない店は後ろに並びます。</p>';
  if(f.sort!=='here'||!HERE)return '';
  const n=(k==='food'?SHOPS:PLAYS).filter(x=>(k==='food'?shopMatch(x):playMatch(x))&&dHere(x)<=1000).length;
  return `<div class="herebar"><span>現在地から近い順（1km以内 ${n}件・${new Date(HERE.t).toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'})}時点）</span><button class="back" id="here-re">位置を更新</button></div>`;
}
function wireSort(k){
  const el=body.querySelector('#sort-'+k),f=FL(k);
  el.onchange=()=>{const v=el.value;if(v==='here'){locateHere(k);el.value=f.sort;return;}f.sort=v;save();render();body.querySelector('.fhead').scrollIntoView({block:'nearest'});};
  const re=body.querySelector('#here-re');if(re)re.onclick=()=>locateHere(k);
}
// 現在地：Claude 上の Artifact では位置情報が使えないので、GitHub Pages 版を案内する
function locateHere(k){
  if(inArtifact||!navigator.geolocation){toast('この画面では現在地を使えません。'+PAGES_URL+' で開くと使えます');return;}
  toast('現在地を確認しています…');
  navigator.geolocation.getCurrentPosition(pos=>{
    HERE={ll:[pos.coords.latitude,pos.coords.longitude],t:Date.now()};
    const f=FL(k);f.sort='here';f.all=true;save();
    hereLayer.clearLayers();L.circleMarker(HERE.ll,{radius:8,color:css('--panel'),weight:3,fillColor:css('--accent'),fillOpacity:1,interactive:false}).addTo(hereLayer);
    L.circle(HERE.ll,{radius:1000,color:css('--accent'),weight:1,opacity:.5,fillOpacity:.04,interactive:false}).addTo(hereLayer);
    render();
    const near=(k==='food'?SHOPS:PLAYS).filter(x=>x.ll&&(k==='food'?shopMatch(x):playMatch(x))).sort((a,b)=>dHere(a)-dHere(b)).slice(0,10);
    if(!near.length||dHere(near[0])>5000){toast('近くに収録している場所がありません（沿線から離れているようです）');map.flyTo(HERE.ll,15,{duration:.6});return;}
    map.flyToBounds(L.latLngBounds(near.map(x=>x.ll).concat([HERE.ll])),Object.assign({maxZoom:17,duration:.6},fitPad()));
  },e=>toast(e.code===1?'位置情報の利用が許可されていません。ブラウザの設定で許可してください':'現在地を取得できませんでした'),{enableHighAccuracy:true,timeout:15000,maximumAge:60000});
}

// 店・遊び場の「行きたい／行った」。S.marks[id]={s:'w'|'v'|null,u:更新日時,d:行った日}。外したときも s:null で残して同期に伝える
var markVer=0;
const markOf=id=>S.marks&&S.marks[id]&&S.marks[id].s||null;
const markTag=id=>{const m=markOf(id);return m?`<span class="mk mk-${m}">${m==='w'?'行きたい':'行った'}</span>`:'';};
const markBtns=id=>{const m=markOf(id);return `<div class="btns markbtns"><button class="tog v" id="mk-v" aria-pressed="${m==='v'}">${m==='v'?'✓ 行った':'行った'}</button><button class="tog w" id="mk-w" aria-pressed="${m==='w'}">${m==='w'?'★ 行きたい':'行きたい'}</button><button class="tog" id="sd-share">共有</button></div>`;};
function setMark(id,s){
  S.marks=S.marks||{};const cur=markOf(id),nx=cur===s?null:s;
  S.marks[id]={s:nx,u:Date.now(),d:nx==='v'?new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10):(S.marks[id]||{}).d||''};
  markVer++;save();render();
  if(nx)toast(nx==='w'?'「行きたい」に入れました。記録タブの「店・遊び場」で一覧できます':'「行った」にしました');
}
function wireMarks(id){body.querySelector('#mk-v').onclick=()=>setMark(id,'v');body.querySelector('#mk-w').onclick=()=>setMark(id,'w');}
function renderMarks(prog,allV){
  const all=Object.entries(S.marks||{}).filter(([,v])=>v.s).map(([id,v])=>{const x=id[0]==='s'?SHOPS.find(s=>s.id===id):PLAYS.find(p=>p.id===id);return x&&{x,v,shop:id[0]==='s'};}).filter(Boolean).sort((a,b)=>b.v.u-a.v.u);
  const row=({x,v,shop})=>`<button class="pinrow shoprow" data-${shop?'shop':'play'}="${x.id}"><span class="nophoto ${shop?'k-food':'k-view'}">${shop?'食':'遊'}</span><span class="pr-body"><span class="pr-t">${esc(x.n)}</span><span class="pr-m">${x.town}・${esc(x.g)}${v.s==='v'&&v.d?'・'+v.d:''}</span></span></button>`;
  const grp=(s,t,empty)=>{const l=all.filter(a=>a.v.s===s);return `<h3 class="sg" style="margin-top:14px">${t} <small class="qs">${l.length}</small></h3><div class="pinlist">${l.length?l.map(row).join(''):`<div class="empty">${empty}</div>`}</div>`;};
  body.innerHTML=`<div class="prog"><div class="pr"><b>全体</b><div class="bar"><i style="width:${allV/STATIONS.length*100}%;background:var(--ink)"></i></div><span class="n">${allV}/${STATIONS.length}</span></div>${prog}</div>
  <div class="chips">${RECF.map(([k,x])=>`<button class="chip" data-f="${k}" aria-pressed="${recFilter===k}">${x}</button>`).join('')}</div>
  ${grp('w','行きたい','店や遊び場の詳細で「行きたい」を押すと、ここに並びます。地図の点にも色の縁が付きます。')}
  ${grp('v','行った','「行った」にした店や遊び場がここに並びます。')}
  ${backupHTML()}`;
  wireBackup();
  body.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{recFilter=b.dataset.f;renderRec();});
  body.querySelectorAll('[data-shop]').forEach(b=>b.onclick=()=>openShop(b.dataset.shop));

// ---------- v24: 道に合わせた経路補正（マップマッチング） ----------
// GPSの点を、登録済みの詳細地図の道（r1〜r3）に重ねて、道を歩いたような経路にする。
// 道から約30m以上離れた点（公園・建物の中など）は補正せず、そのまま残す。詳細地図の範囲外では何もしない。
// 方法: 各点のまわりの道を候補にして、点との距離と、点どうしの間隔が道の上でも保たれるかを合わせて、最もつじつまの合う道を選ぶ（隠れマルコフモデル）。
const MM={R:35,SIG:12,BETA:10,K:5,SW:1,CELL:50,MIN:.2};
async function matchWalk(w){
  const P=w.pts;if(!P||P.length<2||!TILESET.size)return null;
  const need=new Set();
  for(const q of P){const i=Math.floor(q[0]/TDLAT),j=Math.floor(q[1]/TDLNG);
    for(let a=-1;a<=1;a++)for(let b=-1;b<=1;b++){const k=(i+a)+'_'+(j+b);if(TILESET.has(k))need.add(k);}}
  if(!need.size)return null;
  await Promise.all([...need].map(k=>new Promise(r=>loadTile(k,r))));
  let s=90,n=-90,e=-180,wst=180;
  for(const q of P){if(q[0]<s)s=q[0];if(q[0]>n)n=q[0];if(q[1]<wst)wst=q[1];if(q[1]>e)e=q[1];}
  const m=.0006,KLA=111320,KLO=111320*Math.cos((s+n)/2*Math.PI/180);
  const X=lo=>(lo-wst)*KLO,Y=la=>(la-s)*KLA;
  const segs=[],grid=new Map();let way=0;
  for(const k of need){const T=tileData[k];if(!T)continue;
    for(const kind of ['r1','r2','r3']){const R=T.R[kind];if(!R)continue;
      for(const it of R.items){
        if(it.n<s-m||it.s>n+m||it.e<wst-m||it.w>e+m)continue;
        const a=it.a,id=way++;
        for(let q=2;q<a.length;q+=2){
          const sg={x1:X(a[q-1]),y1:Y(a[q-2]),x2:X(a[q+1]),y2:Y(a[q]),way:id},idx=segs.push(sg)-1;
          const c0=Math.floor(Math.min(sg.x1,sg.x2)/MM.CELL),c1=Math.floor(Math.max(sg.x1,sg.x2)/MM.CELL),r0=Math.floor(Math.min(sg.y1,sg.y2)/MM.CELL),r1=Math.floor(Math.max(sg.y1,sg.y2)/MM.CELL);
          for(let cx=c0;cx<=c1;cx++)for(let cy=r0;cy<=r1;cy++){const g=cx+','+cy;(grid.get(g)||grid.set(g,[]).get(g)).push(idx);}
        }}}}
  if(!segs.length)return null;
  const xy=P.map(q=>[X(q[1]),Y(q[0])]);
  const rr=Math.ceil(MM.R/MM.CELL);
  const cand=xy.map(([x,y])=>{
    const cx=Math.floor(x/MM.CELL),cy=Math.floor(y/MM.CELL),best=new Map(),seen=new Set();
    for(let a=-rr;a<=rr;a++)for(let b=-rr;b<=rr;b++)for(const idx of grid.get((cx+a)+','+(cy+b))||[]){
      if(seen.has(idx))continue;seen.add(idx);
      const sg=segs[idx],dx=sg.x2-sg.x1,dy=sg.y2-sg.y1,L2=dx*dx+dy*dy;
      let u=L2?((x-sg.x1)*dx+(y-sg.y1)*dy)/L2:0;u=u<0?0:u>1?1:u;
      const px=sg.x1+u*dx,py=sg.y1+u*dy,d=Math.hypot(x-px,y-py);
      if(d>MM.R)continue;
      const o=best.get(sg.way);if(!o||d<o.d)best.set(sg.way,{x:px,y:py,d,way:sg.way,seg:sg});
    }
    const c=[...best.values()].sort((p,q)=>p.d-q.d).slice(0,MM.K);
    c.push({x,y,d:MM.R*.9,raw:true,way:-1});   // 道に合わせない候補（そのままの位置）
    return c;
  });
  const em=c=>(c.d/MM.SIG)**2/2;
  let prev=cand[0].map(c=>({c,cost:em(c),from:-1})),back=[prev];
  for(let i=1;i<P.length;i++){
    const dr=Math.hypot(xy[i][0]-xy[i-1][0],xy[i][1]-xy[i-1][1]);
    const cur=cand[i].map(c=>{let bc=1e18,bf=-1;
      prev.forEach((p,j)=>{
        let tr=Math.abs(Math.hypot(c.x-p.c.x,c.y-p.c.y)-dr)/MM.BETA;
        if(!c.raw&&!p.c.raw&&c.way!==p.c.way)tr+=MM.SW;
        const v=p.cost+tr;if(v<bc){bc=v;bf=j;}
      });
      return {c,cost:bc+em(c),from:bf};});
    back.push(cur);prev=cur;
  }
  let j=prev.reduce((bi,p,i)=>p.cost<prev[bi].cost?i:bi,0);
  const path=new Array(P.length);
  for(let i=P.length-1;i>=0;i--){const nd=back[i][j];path[i]=nd.c;j=nd.from;}
  const ratio=path.filter(c=>!c.raw).length/P.length;
  if(ratio<MM.MIN)return null;
  const out=[],push=(x,y,tm)=>out.push([+(s+y/KLA).toFixed(6),+(wst+x/KLO).toFixed(6),tm]);
  for(let i=0;i<path.length;i++){
    const c=path[i],tm=P[i][2];
    if(i>0){const p=path[i-1];
      if(!c.raw&&!p.raw&&c.way!==p.way){   // 道が替わるところは、交差点（線分の端）を通るようにする
        const ea=[[p.seg.x1,p.seg.y1],[p.seg.x2,p.seg.y2]],eb=[[c.seg.x1,c.seg.y1],[c.seg.x2,c.seg.y2]];
        let bd=1e9,pa=null,pb=null;
        for(const u of ea)for(const v of eb){const d=Math.hypot(u[0]-v[0],u[1]-v[1]);if(d<bd){bd=d;pa=u;pb=v;}}
        const dd=Math.hypot(c.x-p.x,c.y-p.y);
        if(bd<20&&Math.hypot(pa[0]-p.x,pa[1]-p.y)+Math.hypot(pb[0]-c.x,pb[1]-c.y)+bd<=dd*1.5+10){push(pa[0],pa[1],P[i-1][2]);if(bd>2)push(pb[0],pb[1],tm);}
      }}
    push(c.x,c.y,tm);
  }
  let dist=0;for(let i=1;i<out.length;i++)dist+=km(out[i-1],out[i])*1000;
  return {pts:out,dist,ratio};
}
async function applyMatch(w){

}

function stationsPassed(w){
  if(stCache[w.id]&&stCache[w.id][0]===w.pts.length)return stCache[w.id][1];
  const hit=new Set();
  for(const s of STATIONS){for(let i=0;i<w.pts.length;i+=2){const q=w.pts[i];if(map.distance([q[0],q[1]],s.ll)<=150){hit.add(s.n);break;}}}
  stCache[w.id]=[w.pts.length,hit.size];return hit.size;
}
function stampCtx(){
  const ws=WALKS.filter(w=>!w.active&&w.end),c={n:ws.length,sumD:0,maxD:0,maxT:0,maxP:0,maxS:0,early:false,night:false,wk:[],streak:0,cur:null};
  const wk={};
  for(const w of ws){
    const dur=w.end-w.start,h=new Date(w.start).getHours();
    c.sumD+=w.dist;c.maxD=Math.max(c.maxD,w.dist);c.maxT=Math.max(c.maxT,dur);c.maxP=Math.max(c.maxP,w.photos.length);
    if(h<6)c.early=true;if(h>=20)c.night=true;
    if(w.pts.length>1)c.maxS=Math.max(c.maxS,stationsPassed(w));
    const k=weekKey(w.start),o=wk[k]||(wk[k]={k,n:0,d:0,days:new Set()});o.n++;o.d+=w.dist;o.days.add(new Date(w.start).getDay());
  }
  c.wk=Object.values(wk);
  const goal=k=>wk[k]&&wk[k].n>=WEEK_GOAL.n&&wk[k].d>=WEEK_GOAL.km*1000;
  let run=0;const keys=Object.keys(wk).map(Number).sort((a,b)=>a-b);
  if(keys.length)for(let k=keys[0];k<=keys[keys.length-1];k+=7*864e5){const kk=weekKey(k+12*36e5);run=goal(kk)?run+1:0;c.streak=Math.max(c.streak,run);}
  c.cur=wk[weekKey(Date.now())]||{n:0,d:0,days:new Set()};
  return c;
}
// 条件を満たしたスタンプを渡す。quiet のときはお知らせを出さない（起動時・同期後）
function checkStamps(quiet){

  for(const s of STAMPS)if(!S.stamps[s.id]&&s.ok(c)){S.stamps[s.id]=Date.now();got.push(s);}
  if(got.length){save();if(!quiet)toast(got.length===1?`スタンプ「${got[0].big}（${got[0].sub}）」を手に入れました`:`スタンプを${got.length}個手に入れました（${got.map(s=>s.big).join('・')}）`);}
  return got;
}
