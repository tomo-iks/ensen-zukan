// 写真の EXIF から撮影時刻と位置を読む（JPEG のみ。読めなければ null）
function exifInfo(buf){
  const v=new DataView(buf);if(v.byteLength<4||v.getUint16(0)!==0xFFD8)return null;let o=2;
  while(o<v.byteLength-10){const m=v.getUint16(o),len=v.getUint16(o+2);
    if(m===0xFFE1&&v.getUint32(o+4)===0x45786966)return exifTiff(v,o+10);
    if((m&0xFF00)!==0xFF00||m===0xFFDA)break;o+=2+len;}
  return null;
}
function exifTiff(v,t){
  const le=v.getUint16(t)===0x4949,u16=o=>v.getUint16(o,le),u32=o=>v.getUint32(o,le);
  const ifd=o=>{const n=u16(t+o),e={};for(let i=0;i<n;i++){const q=t+o+2+i*12;e[u16(q)]={count:u32(q+4),off:q+8};}return e;};
  const str=en=>{const ad=en.count>4?t+u32(en.off):en.off;let s='';for(let i=0;i<en.count-1;i++)s+=String.fromCharCode(v.getUint8(ad+i));return s;};
  const dms=en=>{const ad=t+u32(en.off),r=i=>u32(ad+i*8)/(u32(ad+i*8+4)||1);return r(0)+r(1)/60+r(2)/3600;};
  const out={},i0=ifd(u32(t+4));
  if(i0[0x8769]){const ex=ifd(u32(i0[0x8769].off)),d=ex[0x9003]||ex[0x9004];
    if(d){const m=/(\d{4}):(\d\d):(\d\d) (\d\d):(\d\d):(\d\d)/.exec(str(d));if(m)out.t=new Date(+m[1],m[2]-1,+m[3],+m[4],+m[5],+m[6]).getTime();}}
  if(i0[0x8825]){const g=ifd(u32(i0[0x8825].off));
    if(g[2]&&g[4]){let la=dms(g[2]),ln=dms(g[4]);if(g[1]&&str(g[1])==='S')la=-la;if(g[3]&&str(g[3])==='W')ln=-ln;if(la&&ln)out.ll=[la,ln];}}
  return out;
}
// 撮影時刻からお散歩の経路上の位置を求める（お散歩の前後10分まで）
function posAt(w,t){
  const P=w.pts;if(!P.length||t<w.start-6e5||t>(w.end||Date.now())+6e5)return null;
  if(t<=P[0][2])return [P[0][0],P[0][1]];
  for(let i=1;i<P.length;i++)if(P[i][2]>=t){const a=P[i-1],b=P[i],f=(t-a[2])/((b[2]-a[2])||1);return [a[0]+(b[0]-a[0])*f,a[1]+(b[1]-a[1])*f];}
  const z=P[P.length-1];return [z[0],z[1]];
}
async function addWalkPhotos(w,files){
  let ok=0,skip=0;toast(`${files.length}枚の写真を確認しています…`);
  for(const f of files){
    try{let info=null;try{info=exifInfo(await f.slice(0,256*1024).arrayBuffer());}catch(e){}
      const tt=info&&info.t,on=tt?posAt(w,tt):null;
      if(!on){skip++;continue;}
      const ll=(info.ll&&km(info.ll,on)<1)?info.ll:on;  // 写真に位置があり経路の近くならそれを使う
      const blob=await compress(f),id=newId('ph');await store('put','photos',{id,blob});photoURL[id]=URL.createObjectURL(blob);
      w.photos.push({id,lat:ll[0],lng:ll[1],t:tt});ok++;}
    catch(e){skip++;}
  }
  w.photos.sort((a,b)=>a.t-b.t);w.updated=Date.now();await store('put','walks',w);fbSoon();render();
  toast(`${ok}枚を経路上に置きました`+(skip?`。${skip}枚は撮影時刻が読めないか、このお散歩の時間外だったため追加していません`:''));
}

// ---------- アカウント（Firebase：Googleでログインして、ピン・記録・お散歩・写真を端末間で同期） ----------
// 設定値は src/firebase-config.js（window.ENSEN_FIREBASE）。Claude 上の Artifact では外部サービスにつながらないため使えない
const FB_CONFIG=window.ENSEN_FIREBASE||null,FB_VER='10.12.2';
const inArtifact=!!(window.claude&&window.claude.use);
var fbProf=null,fbAdmin=false,adminView=null,fbUser=null,fbState=FB_CONFIG?(inArtifact?'artifact':'loading'):'off',fbBusy=false,fbLast=0,fbTimer=null;
function accountHTML(){
  if(fbState==='off')return '<p class="qs" style="margin:0">アカウント機能はまだ準備中です（Firebaseの設定待ち）。今はこの端末の中にだけ保存されています。</p>';
  if(fbState==='artifact')return `<p class="qs" style="margin:0">Claude上のこの画面ではログインできません。<a href="${PAGES_URL}" target="_blank" rel="noopener">GitHub Pages版</a>でログインしてください。こちらのデータは、バックアップの書き出し→Pages版で読み込み、で移せます。</p>`;
  if(fbState==='loading')return '<p class="qs" style="margin:0">読み込み中…</p>';
  if(fbState==='error')return '<p class="qs" style="margin:0">アカウント機能を読み込めませんでした。通信状況を確認して、ページを開き直してください。</p>';
  if(!fbUser)return '<p class="qs" style="margin:0 0 8px">Googleアカウントでログインすると、ピン・記録・お散歩・写真がクラウドに保存され、別の端末でも同じデータを使えます。</p><button class="primary" id="ac-in">Googleでログイン</button>';
  const notice=fbProf&&!fbProf.notice?`<div class="notice"><b>アカウントについてのお知らせ</b>このアプリの管理者には、あなたの表示名・メールアドレス・登録と最後の利用の日時・ピン/お散歩/写真の件数が見えます。管理者はクラウド上のデータを削除したり、アカウントを停止したりできます（この端末の中のデータには影響しません）。<button class="ghost" id="ac-ok">確認しました</button></div>`:'';
  const stop=fbStopped()?'<p class="qs warn" style="margin:8px 0 0">このアカウントは管理者によって停止されています。クラウドへの保存と同期はできません。この端末の中には、これまでどおり保存されます。</p>':'';
  return notice+`<div class="acct">${fbUser.photoURL?`<img src="${esc(fbUser.photoURL)}" alt="" referrerpolicy="no-referrer">`:''}<span><b>${esc(fbUser.displayName||'ログイン中')}</b><small>${esc(fbUser.email||'')}</small></span></div>
  <p class="qs" style="margin:8px 0">${fbBusy?'同期しています…':fbLast?'最後に同期：'+new Date(fbLast).toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'}):'まだ同期していません'}</p>
  <div class="btns2"><button class="ghost" id="ac-sync" ${fbBusy||fbStopped()?'disabled':''}>今すぐ同期</button><button class="ghost" id="ac-out">ログアウト</button></div>`+stop;
}
function wireAccount(){
  const a=body.querySelector('#ac-in');if(a)a.onclick=fbLogin;
  const s=body.querySelector('#ac-sync');if(s)s.onclick=()=>fbSync();
  const o=body.querySelector('#ac-out');if(o)o.onclick=()=>firebase.auth().signOut();
  const k=body.querySelector('#ac-ok');if(k)k.onclick=async()=>{try{const t=Date.now();await fprof().update({notice:t});fbProf.notice=t;}catch(e){toast('保存できませんでした（'+(e.code||'通信エラー')+'）');}render();};
}
const loadScript=u=>new Promise((res,rej)=>{const s=document.createElement('script');s.src=u;s.onload=res;s.onerror=()=>rej(new Error(u));document.head.appendChild(s);});
async function fbInit(){
  if(fbState!=='loading')return;
  try{const b=`https://www.gstatic.com/firebasejs/${FB_VER}/`;
    await loadScript(b+'firebase-app-compat.js');await Promise.all([loadScript(b+'firebase-auth-compat.js'),loadScript(b+'firebase-firestore-compat.js')]);
    firebase.initializeApp(FB_CONFIG);
    firebase.auth().getRedirectResult().catch(()=>{});
    firebase.auth().onAuthStateChanged(async u=>{fbUser=u;fbState='ready';fbProf=null;fbAdmin=false;adminView=null;ADM.list=null;if(u){await fbProfile();fbSync();}if(settingsOpen)render();});
  }catch(e){fbState='error';if(settingsOpen)render();}
}
function fbLogin(){
  const pr=new firebase.auth.GoogleAuthProvider();
  firebase.auth().signInWithPopup(pr).catch(e=>{
    if(['auth/popup-blocked','auth/operation-not-supported-in-this-environment','auth/cancelled-popup-request'].includes(e.code))firebase.auth().signInWithRedirect(pr);
    else if(e.code!=='auth/popup-closed-by-user')toast('ログインできませんでした（'+e.code+'）');});
}
function fbSoon(){if(!fbUser)return;clearTimeout(fbTimer);fbTimer=setTimeout(fbSync,4000);}
const fdoc=path=>firebase.firestore().doc(`users/${fbUser.uid}/${path}`);
const fcol=name=>firebase.firestore().collection(`users/${fbUser.uid}/${name}`);
async function fbPhotoUp(id,have){if(have[id])return;const o=await store('get','photos',id);if(!o)return;await fdoc('photos/'+id).set({d:await blobToDataURL(o.blob)});have[id]=1;}
async function fbPhotoDown(id){if((await store('get','photos',id)))return;const s=await fdoc('photos/'+id).get();if(!s.exists)return;const blob=await (await fetch(s.data().d)).blob();await store('put','photos',{id,blob});}
// 同期：クラウドと端末の新しいほうを残す。削除したものは S.del に記録して、どちらからも消す
async function fbSync(){
  if(!fbUser||fbBusy||fbStopped())return;fbBusy=true;if(settingsOpen)render();
  try{
    const stSnap=await fdoc('meta/state').get(),st=stSnap.exists?stSnap.data():{};
    const del=Object.assign({},st.del||{},S.del||{}),have=Object.assign({},st.ph||{});
    // 駅ごとの記録・クイズ・自作タグ
    const rec=Object.assign({},st.rec||{},S.rec||{});Object.keys(rec).forEach(n=>{const a=(st.rec||{})[n],b=(S.rec||{})[n];if(a&&b)rec[n]=(a.u||0)>(b.u||0)?a:b;});
    const best=Object.assign({},st.best||{});Object.entries(S.best||{}).forEach(([k,v])=>{if(best[k]==null||v>best[k])best[k]=v;});
    const qs=Object.assign({},st.qs||{});Object.entries(S.qs||{}).forEach(([k,v])=>{const r=qs[k];qs[k]=r?{ok:Math.max(r.ok,v.ok),ng:Math.max(r.ng,v.ng)}:v;});
    const stamps=Object.assign({},st.stamps||{});Object.entries(S.stamps||{}).forEach(([k,v])=>{if(!stamps[k]||v<stamps[k])stamps[k]=v;});S.stamps=stamps;
    const marks=Object.assign({},st.marks||{});Object.entries(S.marks||{}).forEach(([k,v])=>{if(!marks[k]||(v.u||0)>(marks[k].u||0))marks[k]=v;});S.marks=marks;markVer++;
    S.rec=rec;S.best=best;S.qs=qs;S.del=del;S.ui.tags=[...new Set([...(st.tags||[]),...(S.ui.tags||[])])];
    // ピン
    const rp=(await fcol('pins').get()).docs.map(d=>d.data());
    for(const r of rp){if(del[r.id]){await fdoc('pins/'+r.id).delete();continue;}const l=PINS.find(x=>x.id===r.id);
      if(!l||(r.updated||0)>(l.updated||0)){for(const id of r.photos)await fbPhotoDown(id);await store('put','pins',r);PINS=PINS.filter(x=>x.id!==r.id).concat(r);}}
    for(const l of PINS){if(del[l.id])continue;const r=rp.find(x=>x.id===l.id);
      if(!r||(l.updated||0)>(r.updated||0)){for(const id of l.photos)await fbPhotoUp(id,have);await fdoc('pins/'+l.id).set(l);}}
    // お散歩（Firestore は配列の入れ子を保存できないので、経路は文字列にする）
    const rw=(await fcol('walks').get()).docs.map(d=>{const x=d.data();return Object.assign({},x,{pts:JSON.parse(x.ptsJ||'[]'),ptsJ:undefined});});
    const wu=w=>w.updated||w.end||0;
    for(const r of rw){delete r.ptsJ;if(del[r.id]){await fdoc('walks/'+r.id).delete();continue;}const l=WALKS.find(x=>x.id===r.id);
      if(!l||wu(r)>wu(l)){for(const ph of r.photos)await fbPhotoDown(ph.id);await store('put','walks',r);WALKS=WALKS.filter(x=>x.id!==r.id).concat(r);}}
    for(const l of WALKS){if(del[l.id]||l.active)continue;const r=rw.find(x=>x.id===l.id);
      if(!r||wu(l)>wu(r)){for(const ph of l.photos)await fbPhotoUp(ph.id,have);const o=Object.assign({},l,{ptsJ:JSON.stringify(l.pts)});delete o.pts;await fdoc('walks/'+l.id).set(o);}}
    // 削除済みの写真
    for(const id of Object.keys(have))if(del[id]){await fdoc('photos/'+id).delete();delete have[id];}
    await fdoc('meta/state').set({rec,best,qs,del,ph:have,tags:S.ui.tags,stamps,marks,updated:Date.now()});
    try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}
    await fbTouch();
    checkStamps(true);
    fbLast=Date.now();refreshPins();refreshWalkAll();styleMarkers();
  }catch(e){toast('同期できませんでした（'+(e&&e.code||'通信エラー')+'）');}
  fbBusy=false;if(settingsOpen)render();
}
// ---------- 利用者プロフィールと管理（v11） ----------
// profiles/{uid}：表示名・メール・初回/最後のログイン・件数・状態（active / suspended）。管理者は admins/{uid} がある人（Firebaseコンソールで作る）
// アクセスの制限は firestore.rules（Firebaseコンソールの Firestore → ルール に貼る）
const APP_VER='v22';
const fprof=uid=>firebase.firestore().doc('profiles/'+(uid||fbUser.uid));
const fbStopped=()=>!!(fbProf&&fbProf.status==='suspended');
const myCounts=()=>({pins:PINS.length,walks:WALKS.length,photos:PINS.reduce((a,p)=>a+p.photos.length,0)+WALKS.reduce((a,w)=>a+w.photos.length,0)});
async function fbProfile(){
  const me={name:fbUser.displayName||'',email:fbUser.email||'',photo:fbUser.photoURL||'',last:Date.now(),ver:APP_VER};
  try{
    const s=await fprof().get();
    if(!s.exists){fbProf=Object.assign(me,{created:Date.now(),status:'active',notice:0,n:myCounts()});await fprof().set(fbProf);}
    else{fbProf=Object.assign(s.data(),me);await fprof().update(me);}
    fbAdmin=(await firebase.firestore().doc('admins/'+fbUser.uid).get()).exists;
  }catch(e){/* ルール未設定などで読めないときは、管理の仕組みなしで動く */}
}
async function fbTouch(){if(!fbProf)return;try{const o={n:myCounts(),last:Date.now()};await fprof().update(o);Object.assign(fbProf,o);}catch(e){}}

var ADM={list:null,log:null,busy:false};
const DAY=864e5;
const ago=t=>{if(!t)return '—';const d=Date.now()-t;return d<36e5?Math.max(1,Math.round(d/6e4))+'分前':d<DAY?Math.round(d/36e5)+'時間前':d<30*DAY?Math.round(d/DAY)+'日前':new Date(t).toLocaleDateString('ja-JP');};
const ymd=t=>t?new Date(t).toLocaleString('ja-JP',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}):'—';
const ACT={suspend:'停止',resume:'再開',wipe:'データ削除＋停止'};
async function admLoad(){
  const db=firebase.firestore();
  try{
    ADM.list=(await db.collection('profiles').get()).docs.map(d=>Object.assign({uid:d.id,n:{}},d.data()));
    ADM.log=(await db.collection('adminLog').orderBy('at','desc').limit(30).get()).docs.map(d=>d.data());
  }catch(e){ADM.list=ADM.list||[];ADM.err=e.code||'通信エラー';}

function admSorted(){
  const q=(adminView.q||'').trim().toLowerCase(),k=adminView.sort;
  const f=ADM.list.filter(p=>!q||(p.name+' '+p.email).toLowerCase().includes(q));
  const key={last:p=>-(p.last||0),created:p=>-(p.created||0),pins:p=>-((p.n.pins||0)+(p.n.walks||0)),name:p=>p.name||''}[k];
  return f.sort((a,b)=>{const x=key(a),y=key(b);return typeof x==='string'?x.localeCompare(y,'ja'):x-y;});
}
function admRows(){
  const l=admSorted();

}
function renderAdmin(){
  const head=`<div class="shead"><h2 class="pin-title" style="margin:0">利用者の管理</h2><button class="back" id="ad-back">${adminView.uid?'一覧へ':'設定へ'}</button></div>`;

  if(adminView.uid)return renderAdminUser(head);
  const U=ADM.list,now=Date.now(),sum=k=>U.reduce((a,p)=>a+(p.n[k]||0),0),m0=new Date(new Date().getFullYear(),new Date().getMonth(),1).getTime();
  const st=[['利用者',U.length+'人'],['7日以内に利用',U.filter(p=>now-(p.last||0)<7*DAY).length+'人'],['30日以内に利用',U.filter(p=>now-(p.last||0)<30*DAY).length+'人'],

async function admRun(p,act){
  if(ADM.busy)return;ADM.busy=true;toast(act==='wipe'?'削除しています…':'変更しています…');
  const db=firebase.firestore(),now=Date.now();
  try{
    let o={status:act==='resume'?'active':'suspended',statusAt:now,statusBy:fbUser.uid};
    if(act==='wipe'){
      for(const c of ['pins','walks','photos']){
        const ds=(await db.collection(`users/${p.uid}/${c}`).get()).docs;
        for(let i=0;i<ds.length;i+=400){const b=db.batch();ds.slice(i,i+400).forEach(d=>b.delete(d.ref));await b.commit();}
      }
      await db.doc(`users/${p.uid}/meta/state`).delete();
      o=Object.assign(o,{wipedAt:now,n:{pins:0,walks:0,photos:0}});
    }
    await fprof(p.uid).update(o);Object.assign(p,o);
    const g={by:fbUser.uid,byName:fbUser.displayName||'',target:p.uid,targetName:p.name||'',act,at:now};
    await db.collection('adminLog').add(g);(ADM.log=ADM.log||[]).unshift(g);
    toast({suspend:'停止しました',resume:'停止を解除しました',wipe:'削除して停止しました'}[act]);
  }catch(e){toast('できませんでした（'+(e.code||'通信エラー')+'）');}
  ADM.busy=false;if(adminView)render();
}
